                <div className="btn-group"><button className="btn btn-primary" onClick={installerMaj}>Mettre à jour</button><button className="btn btn-outline" onClick={() => masquerMaj(maj.disponible.version)}>Plus tard</button></div>
              </div>
            )}
            {majEnCours && (
              <div className="modal-overlay"><div className="modal">
                {majEnCours.erreur
                  ? (<><div className="modal-title" style={{marginBottom: 12}}>La mise à jour n'a pas abouti</div><p className="alerte-info">{majEnCours.erreur}</p><div className="btn-group"><button className="btn btn-outline" onClick={() => setMajEnCours(null)}>Fermer</button></div></>)
                  : (<><div className="modal-title" style={{marginBottom: 12}}>{majEnCours.libelle}…</div><p style={{fontSize: 13}}>Ne fermez pas la fenêtre : le Facturier se recharge tout seul dans quelques secondes. Vos données ne sont pas touchées.</p></>)}
              </div></div>
            )}
            {conflit && (
              <div className="modal-overlay"><div className="modal">
                <div className="modal-title" style={{marginBottom: 12}}>Données modifiées ailleurs</div>
                <p style={{fontSize: 13}}>Les données ont été enregistrées depuis une autre fenêtre du Facturier pendant que celle-ci était ouverte. Pour ne rien écraser, cette fenêtre n'enregistre plus. Rechargez-la pour repartir des données à jour (les modifications faites ici depuis le dernier enregistrement seront à refaire).</p>
                <div className="btn-group"><button className="btn btn-primary" onClick={() => location.reload()}>Recharger</button></div>
              </div></div>
            )}
            {remplacee && (
              <div className="modal-overlay"><div className="modal">
                <div className="modal-title" style={{marginBottom: 12}}>Le Facturier est ouvert dans une autre fenêtre</div>
                <p style={{fontSize: 13}}>Pour ne rien perdre, une seule fenêtre peut travailler à la fois. Celle-ci est désactivée ; vos dernières modifications ont été enregistrées. Fermez-la et continuez dans l'autre.</p>
                <div className="btn-group"><button className="btn btn-primary" onClick={() => window.close()}>Fermer cette fenêtre</button></div>
              </div></div>
            )}
            {pret === 'erreur' && <div className="card bandeau-import"><div className="card-title">Données illisibles</div><p>Le fichier des données n'a pas pu être lu : rien ne sera enregistré pendant cette session. Fermez la fenêtre et rouvrez le Facturier ; si le problème continue, une sauvegarde du jour précédent se trouve dans le dossier « donnees/sauvegardes ».</p></div>}
            {!pret ? <div className="card"><p>Chargement des données…</p></div> : <>
            {premiereOuverture && <BandeauPremiereOuverture updateData={updateData} showToast={showToast} onFini={() => setPremiereOuverture(false)} />}
            {page === 'douanes' && !estSimple(data) && <PageDouanes data={data} updateData={updateData} setPage={setPage} showToast={showToast} />}
            {page === 'suivi' && <PageSuivi data={data} stats={stats} setPage={setPage} updateData={updateData} showToast={showToast} />}
            {page === 'factures' && <PageFactures data={data} updateData={updateData} getNextNum={getNextFactureNum} showToast={showToast} />}
            {page === 'produits' && !estSimple(data) && <PageProduits data={data} updateData={updateData} getNextRef={getNextProduitRef} showToast={showToast} />}
            {page === 'clients' && <PageClients data={data} updateData={updateData} getNextNum={getNextClientNum} showToast={showToast} />}
            {page === 'parametres' && <PageParametres data={data} updateData={updateData} showToast={showToast} />}
            </>}
          </main>
          </EntrepriseCtx.Provider>
          </ConnexionCtx.Provider>
          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    }

    // Première ouverture via le relais : l'adresse a changé, les données de l'ancien fichier sont à importer une fois
    function BandeauPremiereOuverture({ updateData, showToast, onFini }) {
      const importer = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => { importerSauvegarde(ev.target.result, { factures: [], entreprise: {} }, updateData, showToast); onFini(); };
        reader.readAsText(file);
      };
      return (
        <div className="card bandeau-import">
          <div className="card-title">Bienvenue dans le facturier connecté</div>
          <p style={{marginBottom: 10}}>Vos données ne sont pas encore dans cette nouvelle version. Importez la sauvegarde exportée depuis l'ancien facturier (Paramètres, Sauvegarde & Export, JSON) : elles seront ensuite enregistrées automatiquement dans le dossier du Facturier.</p>
          <div className="btn-group" style={{marginTop: 0}}>
            <label className="btn btn-primary" style={{cursor: 'pointer'}}>{Icons.upload} Importer ma sauvegarde<input type="file" accept=".json" onChange={importer} style={{display: 'none'}} /></label>
            <button className="btn btn-outline" onClick={onFini}>Plus tard</button>
          </div>
        </div>
      );
    }

    // Paramètres : connexion à Super PDP (identifiants gardés par le programme local, jamais dans le navigateur)
    function CarteSuperPDP() {
      const cx = React.useContext(ConnexionCtx);
      const [cid, setCid] = useState('');
      const [sec, setSec] = useState('');
      const [encours, setEncours] = useState(false);
      const [msg, setMsg] = useState('');
      const [modifier, setModifier] = useState(false);
      const connecter = async () => {
        setEncours(true); setMsg('');
        try { await appelRelais('/api/identifiants', { methode: 'POST', type: 'application/json', corps: JSON.stringify({ client_id: cid, client_secret: sec }) }); setCid(''); setSec(''); setModifier(false); await cx.rafraichir(); }
        catch (e) { setMsg(e.message); }
        setEncours(false);
      };
      const deconnecter = async () => { try { await appelRelais('/api/identifiants', { methode: 'DELETE' }); await cx.rafraichir(); } catch (e) { setMsg(e.message); } };
      if (!RELAIS) return (
        <div className="card"><div className="card-title">Connexion Super PDP</div>
          <p style={{fontSize: 13}}>Le facturier est ouvert comme un simple fichier : les factures électroniques se déposent à la main sur Super PDP. Pour les envoyer directement, ouvrez le Facturier par son icône.</p>
        </div>);
      const ent = cx.entreprise || {};
      return (
        <div className="card"><div className="card-title">Connexion Super PDP</div>
          {cx.etat === 'chargement' && <p style={{fontSize: 13}}>Vérification…</p>}
          {cx.etat === 'ok' && !modifier && (<>
            <p className="connexion-ok">✓ Connecté à Super PDP : {ent.formal_name || ent.name || 'entreprise'}{ent.number ? ` — SIREN ${ent.number}` : ''}</p>
            {estBacASable(cx) && <p className="alerte-info">Compte de test (bac à sable) : les factures sont émises au nom de l'entreprise fictive {ent.formal_name} et ne partent chez aucun vrai client.</p>}
            {cx.verification && cx.verification !== 'verified' && <p className="alerte-info">Super PDP n'a pas encore terminé la vérification de l'entreprise (statut : {cx.verification}) : l'envoi de factures sera possible ensuite.</p>}
            <div className="btn-group"><button className="btn btn-outline" onClick={() => setModifier(true)}>Changer les identifiants</button><button className="btn btn-outline" onClick={deconnecter}>Déconnecter</button></div>
          </>)}
          {cx.etat === 'erreur' && !modifier && (<>
            <p className="alerte-info">Super PDP ne répond pas comme prévu : {cx.message}</p>
            <div className="btn-group"><button className="btn btn-outline" onClick={() => cx.rafraichir()}>Réessayer</button><button className="btn btn-outline" onClick={() => setModifier(true)}>Changer les identifiants</button></div>
          </>)}
          {(cx.etat === 'non_configure' || modifier) && (<>
            <p style={{fontSize: 13, marginBottom: 10}}>Dans votre compte Super PDP, créez une application puis copiez ici son identifiant et son secret. Ils sont enregistrés sur ce PC, dans le dossier « donnees » du Facturier, et ne sont jamais conservés par le navigateur.</p>
            <div className="form-grid">
              <div className="form-group full"><label>Identifiant de l'application</label><input value={cid} onChange={e => setCid(e.target.value)} autoComplete="off" /></div>
              <div className="form-group full"><label>Secret</label><input type="password" value={sec} onChange={e => setSec(e.target.value)} autoComplete="new-password" /></div>
            </div>
            {msg && <p className="alerte-info">{msg}</p>}
            <div className="btn-group"><button className="btn btn-primary" disabled={encours || !cid || !sec} onClick={connecter}>{encours ? 'Vérification…' : 'Connecter'}</button>{modifier && <button className="btn btn-outline" onClick={() => { setModifier(false); setMsg(''); }}>Annuler</button>}</div>
          </>)}
        </div>
      );
    }

    // Paramètres : version installée, recherche et installation des mises à jour, retour arrière
    function CarteMisesAJour() {
      const cx = React.useContext(ConnexionCtx);
      const [recherche, setRecherche] = useState(false);
      if (!RELAIS) return null;
      const m = cx.maj || {};
      const chercher = async () => { setRecherche(true); await cx.rechercherMaj(); setRecherche(false); };
      return (
        <div className="card"><div className="card-title">Mises à jour</div>
          <p style={{fontSize: 13, marginBottom: 8}}>Version installée : <strong>{m.actuelle || '…'}</strong></p>
          {m.erreur && <p className="alerte-info">{m.erreur}</p>}
          {m.disponible
            ? (<><p style={{fontSize: 13, marginBottom: 6}}>Nouvelle version disponible : <strong>{m.disponible.version}</strong></p>
                {m.disponible.notes && <div className="notes-maj">{m.disponible.notes}</div>}</>)
            : (!m.erreur && m.actuelle && <p style={{fontSize: 13, color: 'var(--text-muted)'}}>Le Facturier est à jour.</p>)}
          <div className="btn-group">
            {m.disponible && <button className="btn btn-primary" onClick={cx.installerMaj}>Mettre à jour</button>}
            <button className="btn btn-outline" onClick={chercher} disabled={recherche}>{recherche ? 'Recherche…' : 'Rechercher une mise à jour'}</button>
            {m.precedente && <button className="btn btn-outline" onClick={() => { if (window.confirm(`Revenir à la version ${m.precedente} ? Vos données ne sont pas modifiées.`)) cx.revenirMaj(); }}>Revenir à la version {m.precedente}</button>}
          </div>
          <p style={{fontSize: 12, color: 'var(--text-muted)', marginTop: 8}}>Chaque version est signée par Antoine : le Facturier refuse toute version dont la signature n'est pas valide. Vos données sont sauvegardées avant chaque mise à jour.</p>
        </div>
      );
    }

    // Factures reçues des fournisseurs via Super PDP
    function PageRecues({ showToast, integre }) {
      const cx = React.useContext(ConnexionCtx);
      const [liste, setListe] = useState([]);
      const [suite, setSuite] = useState(false);
      const [encours, setEncours] = useState(false);
      const [erreur, setErreur] = useState('');
      const charger = async (apres) => {
        setEncours(true); setErreur('');
        try {
          const r = await appelRelais(`/api/recues${apres ? `?apres=${apres}` : ''}`);
          setListe(l => apres ? [...l, ...(r.data || [])] : (r.data || [])); setSuite(!!r.has_after);
        } catch (e) { setErreur(e.message); }
        setEncours(false);
      };
      useEffect(() => { if (cx.etat === 'ok') charger(); }, [cx.etat]);
      const voir = async (id) => {
        const w = window.open('', '_blank');
        try {
          const b = await appelRelais(`/api/recues/${id}/pdf`); const u = URL.createObjectURL(b);
          if (w) w.location.href = u;
          else { const a = document.createElement('a'); a.href = u; a.download = `facture_recue_${id}.${b.type === 'application/pdf' ? 'pdf' : 'xml'}`; a.click(); }
        }
        catch (e) { if (w) w.close(); showToast(e.message); }
      };
      const montant = (v) => v === undefined || v === null || v === '' ? '' : formatMoney(parseFloat(v));
      return (
        <div>
          {integre
            ? (cx.etat === 'ok' && <div className="btn-group" style={{marginTop: 0, marginBottom: 12, justifyContent: 'flex-end'}}><button className="btn btn-outline" onClick={() => charger()} disabled={encours}>{encours ? 'Chargement…' : 'Actualiser'}</button></div>)
            : <div className="page-header"><h1 className="page-title">Factures reçues</h1>{cx.etat === 'ok' && <button className="btn btn-outline" onClick={() => charger()} disabled={encours}>{encours ? 'Chargement…' : 'Actualiser'}</button>}</div>}
          {cx.etat !== 'ok' && <div className="card"><p>Connectez d'abord le facturier à Super PDP (Paramètres, Connexion Super PDP).</p></div>}
          {erreur && <p className="alerte-info">{erreur}</p>}
          {cx.etat === 'ok' && (
            <div className="card" style={{padding: 0, overflow: 'hidden'}}>
              <table>
                <thead><tr><th>Reçue le</th><th>Fournisseur</th><th>N° facture</th><th>Date</th><th>Échéance</th><th style={{textAlign: 'right'}}>Montant TTC</th><th>Statut</th><th></th></tr></thead>
                <tbody>
                  {!liste.length ? <tr><td colSpan="8" style={{textAlign: 'center', padding: 40}}>{encours ? 'Chargement…' : 'Aucune facture reçue pour le moment'}</td></tr> : liste.map(x => {
                    const en = x.en_invoice || {}, vend = en.seller || {}, tot = en.totals || {};
                    const st = statutPrincipal(evenementsCompacts(x.events));
                    return (
                      <tr key={x.id}>
                        <td>{formatDate((x.created_at || '').slice(0, 10))}</td>
                        <td>{vend.name || vend.trading_name || '-'}{vend.legal_registration_identifier && vend.legal_registration_identifier.value && <div className="nom-legal">SIREN {vend.legal_registration_identifier.value}</div>}</td>
                        <td className="ref-code">{en.number || '-'}</td>
                        <td>{en.issue_date ? formatDate(en.issue_date) : '-'}</td>
                        <td>{en.payment_due_date ? formatDate(en.payment_due_date) : '-'}</td>
                        <td style={{textAlign: 'right'}}>{montant(tot.total_with_vat ?? tot.amount_due_for_payment)}</td>
                        <td style={{fontSize: 12}}>{st ? st.texte : ''}</td>
                        <td><button className="btn btn-outline btn-sm" onClick={() => voir(x.id)}>{Icons.eye} Voir</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {suite && <div style={{padding: 12, textAlign: 'center'}}><button className="btn btn-outline" disabled={encours} onClick={() => charger(liste[liste.length - 1].id)}>Afficher les suivantes</button></div>}
            </div>
          )}
        </div>
      );
    }

    function NavItem({ icon, label, active, onClick, badge }) {
      return (
        <div className={`nav-item ${active ? 'active' : ''}`} onClick={onClick}>
          {icon} {label}
          {badge && <span className="badge-count">{badge}</span>}
        </div>
      );
    }

    function ConfirmModal({ title, message, onConfirm, onCancel, type = 'danger' }) {
      return (
        <div className="modal-overlay" onClick={onCancel}>
          <div className="modal small" onClick={e => e.stopPropagation()}>
            <div className="confirm-modal">
              <div className={`icon ${type}`}>{type === 'danger' ? Icons.alert : Icons.check}</div>
              <h3>{title}</h3>
              <p>{message}</p>
              <div className="btn-group" style={{justifyContent: 'center'}}>
                <button className={`btn ${type === 'danger' ? 'btn-danger' : 'btn-success'}`} onClick={onConfirm}>Confirmer</button>
                <button className="btn btn-outline" onClick={onCancel}>Annuler</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function PaymentDateModal({ onConfirm, onCancel }) {
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [skip, setSkip] = useState(false);
      return (
        <div className="modal-overlay" onClick={onCancel}>
          <div className="modal small" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">Facture payée</div>
              <button className="close-btn" onClick={onCancel}>×</button>
            </div>
            <p style={{marginBottom: 16, color: 'var(--text-muted)', fontSize: 14}}>Enregistrer la date de paiement ?</p>
            <div className="form-group">
              <label>Date de paiement</label>
              <input type="date" value={date} onChange={e => setDate(e.target.value)} disabled={skip} />
            </div>
            <label style={{display: 'flex', alignItems: 'center', gap: 8, marginTop: 8, cursor: 'pointer', fontSize: 13}}>
              <input type="checkbox" checked={skip} onChange={e => setSkip(e.target.checked)} />
              Ne pas saisir de date
            </label>
            <div className="btn-group" style={{marginTop: 20}}>
              <button className="btn btn-success" onClick={() => onConfirm(skip ? null : date)}>Valider</button>
              <button className="btn btn-outline" onClick={onCancel}>Annuler</button>
            </div>
          </div>
        </div>
      );
    }

    // Bouton + fenêtre « Facture électronique » : envoi direct via le relais local, ou fichier à déposer à la main
    function BoutonFacturX({ facture, data, updateData, showToast }) {
      const cx = React.useContext(ConnexionCtx);
      const direct = cx.etat === 'ok';
      const [etape, setEtape] = useState(null); // problemes | verification | pret_envoi | envoi | envoyee | refusee | suivi | generation | pret | erreur
      const [msg, setMsg] = useState('');
      const [annuaire, setAnnuaire] = useState(null);
      const [erreurs, setErreurs] = useState([]);
      const [actualisation, setActualisation] = useState(false);
      const copie = useRef(null);
      const f = data.factures.find(x => x.numero === facture.numero) || facture;
      const c = clientDeFacture(f, data);
      const bacASable = direct && estBacASable(cx);
      const dataEnvoi = direct ? donneesEnvoi(data, cx) : data;
      const sirenCompte = (cx.entreprise && cx.entreprise.number) || '';
      const autreCompte = direct && !bacASable && sirenCompte && chiffres(data.entreprise.siret).slice(0, 9) !== sirenCompte;
      const pb = [...problemesFacturX(f, dataEnvoi, { bacASable }),
        ...(autreCompte ? [`Le compte Super PDP connecté (${cx.entreprise.formal_name || ''}, SIREN ${sirenCompte}) n'est pas celui de l'entreprise des Paramètres (SIRET ${data.entreprise.siret}) : vérifiez les identifiants`] : [])];
      const t = totauxFacture(f, data);
      const nomFichier = `${f.numero}_facture_electronique.pdf`;
      const majFacture = (maj) => updateData({ factures: data.factures.map(x => x.numero === f.numero
        ? { ...(maj.efacture && (maj.efacture.id || maj.efacture.deposeeLe) && !(x.efacture && (x.efacture.id || x.efacture.deposeeLe)) ? figerClient(x, data) : x), ...maj } : x) });
      const siren = chiffres(c.siren);

      const telechargerSeulement = async () => {
        setEtape('generation');
        try {
          const octets = await genererFacturX(f, data);
          telecharger(octets, nomFichier, 'application/pdf');
          majFacture({ efacture: { ...(f.efacture || {}), genereeLe: new Date().toISOString() } });
          setEtape('pret');
        } catch (err) { setMsg(String(err.message || err)); setEtape('erreur'); }
      };
      const lancer = async () => {
        // Déjà déposée (directement ou à la main) : on montre le suivi, jamais un second envoi
        if (efactureDeposee(f) || (f.efacture?.deposeeLe && !f.efacture?.id)) { setEtape('suivi'); return; }
        if (pb.length) { setEtape('problemes'); return; }
        if (!direct) return telechargerSeulement();
        setEtape('verification'); setAnnuaire(null);
        try { setAnnuaire(await appelRelais(`/api/annuaire?siren=${siren}`)); }
        catch (e) { setAnnuaire({ erreur: e.message }); }
        setEtape('pret_envoi');
      };
      const adresse = annuaire && !annuaire.erreur ? adresseAnnuaire(siren, annuaire.entrees) : '';
      const inscrit = annuaire && annuaire.entrees && annuaire.entrees.some(e => e.is_active !== false);
      const envoyer = async () => {
        setEtape('envoi'); setErreurs([]);
        try {
          // L'adresse de réception trouvée dans l'annuaire est reprise dans la facture (par défaut : le SIREN)
          const adr = adresse || c.adresseElectronique || siren;
          const fx = adr !== siren ? { ...f, client: { ...(f.client || c), adresseElectronique: adr } } : f;
          const octets = await genererFacturX(fx, dataEnvoi);
          copie.current = octets;
          const empreinte = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(facturXML(fx, dataEnvoi))))].map(b => b.toString(16).padStart(2, '0')).join('');
          const r = await appelRelais(`/api/envoyer?numero=${encodeURIComponent(f.numero)}&empreinte=${empreinte}`, { methode: 'POST', type: 'application/pdf', corps: new Blob([octets], { type: 'application/pdf' }) });
          if (!r.envoye) { setErreurs(r.erreurs || []); setEtape('refusee'); return; }
          const liste = evenementsCompacts(r.facture.events), principal = statutPrincipal(liste);
          majFacture({
            efacture: { ...(f.efacture || {}), id: r.facture.id, deposeeLe: new Date().toISOString().split('T')[0], envoiDirect: true, adresse: adr, ...(bacASable ? { test: true } : {}),
              evenements: liste, statut: principal ? principal.code : 'api:uploaded', statutTexte: principal ? principal.texte : 'Téléversée', raison: '' },
            ...(f.statut === 'emise' ? { statut: 'envoyee' } : {})
          });
          setEtape('envoyee');
          setTimeout(() => cx.actualiserSuivi && cx.actualiserSuivi(), 20000);
        } catch (err) { setMsg(String(err.message || err)); setEtape('erreur'); }
      };
      const deposee = () => {
        majFacture({ efacture: { ...(f.efacture || {}), deposeeLe: new Date().toISOString().split('T')[0] }, ...(f.statut === 'emise' ? { statut: 'envoyee' } : {}) });
        showToast('Facture électronique enregistrée comme déposée');
        setEtape(null);
      };
      const actualiser = async () => { setActualisation(true); await cx.actualiserSuivi(false); setActualisation(false); };
      const libelle = efactureRefusee(f) ? 'Facture électronique : refusée par le client' : efactureEnEchec(f) ? 'Facture électronique : rejetée' : f.efacture?.id ? `Facture électronique : ${f.efacture.statutTexte || 'envoyée'}` : `Facture électronique${f.efacture?.deposeeLe ? ' ✓' : ''}`;
      const fermer = () => !['generation', 'envoi', 'verification'].includes(etape) && setEtape(null);
      const evs = (f.efacture && f.efacture.evenements) || [];
      return (
        <>
          <button className={`btn btn-outline${efactureEnEchec(f) ? ' btn-echec' : ''}`} onClick={lancer} title={pb.length && !efactureDeposee(f) ? pb.join('\n') : direct ? 'Envoyer la facture électronique via Super PDP' : 'Produire le fichier officiel (Factur-X) à déposer sur Super PDP'}>
            {direct ? Icons.upload : Icons.download} {libelle}
          </button>
          {etape && (
            <div className="modal-overlay" onClick={fermer}>
              <div className="modal" onClick={ev => ev.stopPropagation()}>
                <div className="modal-header"><div className="modal-title">Facture électronique — {f.numero}</div>{!['generation', 'envoi', 'verification'].includes(etape) && <button className="close-btn" onClick={() => setEtape(null)}>×</button>}</div>
                {etape === 'problemes' && (<>
                  {efactureEnEchec(f) && <p className="alerte-info" style={{marginBottom: 12}}>La plateforme a refusé l'envoi précédent : {f.efacture.statutTexte}{f.efacture.raison ? ` — ${f.efacture.raison}` : ''}</p>}
                  <p style={{marginBottom: 12}}>Cette facture ne peut pas encore être produite au format électronique :</p>
                  <ul style={{marginLeft: 20, marginBottom: 16, lineHeight: 1.7}}>{pb.map((x, i) => <li key={i}>{x}</li>)}</ul>
                  <div className="btn-group"><button className="btn btn-outline" onClick={() => setEtape(null)}>Fermer</button></div>
                </>)}
                {etape === 'verification' && <p>Vérification du client dans l'annuaire officiel…</p>}
                {etape === 'pret_envoi' && (<>
                  {bacASable && <p className="alerte-info" style={{marginBottom: 12}}>Mode test (bac à sable) : la facture sera émise au nom de {cx.entreprise.formal_name}, l'entreprise fictive du compte de test.</p>}
                  {efactureEnEchec(f) && <p className="alerte-info" style={{marginBottom: 12}}>Envoi précédent refusé : {f.efacture.statutTexte}{f.efacture.raison ? ` — ${f.efacture.raison}` : ''}. Vérifiez la correction avant de renvoyer.</p>}
                  <p style={{marginBottom: 6}}><strong>{c.nom}</strong>{enseigneDistincte(c) ? ` (${enseigneDistincte(c)})` : ''} — SIREN {siren}</p>
                  <p style={{marginBottom: 12}}>Montant : <strong>{formatMoney(t.totalTTC)}</strong> TTC</p>
                  {annuaire && annuaire.erreur && <p className="alerte-info">L'annuaire officiel n'a pas pu être consulté : {annuaire.erreur}</p>}
                  {annuaire && !annuaire.erreur && (inscrit
                    ? <p className="annuaire-ok" style={{marginBottom: 12}}>✓ Ce client est inscrit dans l'annuaire officiel : sa plateforme recevra la facture{adresse && adresse !== siren ? ` (adresse ${adresse})` : ''}.</p>
                    : <p className="alerte-info" style={{marginBottom: 12}}>Ce SIREN n'a pas encore de plateforme dans l'annuaire officiel : la facture risque de ne pas pouvoir lui être livrée. Vous pouvez l'envoyer quand même, ou attendre que le client choisisse sa plateforme.</p>)}
                  <p style={{fontSize: 12, color: 'var(--text-muted)', marginBottom: 12}}>Une fois envoyée, la facture ne pourra plus être modifiée ni supprimée. Pour une correction, il faudra faire un avoir.</p>
                  <div className="btn-group">
                    <button className="btn btn-primary" onClick={envoyer}>{Icons.upload} Envoyer via Super PDP</button>
                    <button className="btn btn-outline" onClick={telechargerSeulement}>Télécharger le fichier sans l'envoyer</button>
                  </div>
                </>)}
                {etape === 'envoi' && <p>Préparation, contrôle par Super PDP puis envoi…</p>}
                {etape === 'envoyee' && (<>
                  <p style={{marginBottom: 12}}>✓ La facture a été déposée sur Super PDP, qui la transmet à la plateforme du client. Son statut se mettra à jour tout seul dans le facturier.</p>
                  <div className="btn-group">
                    <button className="btn btn-primary" onClick={() => setEtape(null)}>Fermer</button>
                    {copie.current && <button className="btn btn-outline" onClick={() => telecharger(copie.current, nomFichier, 'application/pdf')}>{Icons.download} Garder une copie</button>}
                  </div>
                </>)}
                {etape === 'refusee' && (<>
                  <p style={{marginBottom: 8}}>Super PDP a refusé la facture au contrôle : <strong>rien n'a été envoyé</strong>.</p>
                  <ul style={{marginLeft: 20, marginBottom: 16, lineHeight: 1.6, fontSize: 13}}>{(erreurs.length ? erreurs : ['Raison non précisée']).map((x, i) => <li key={i}>{x}</li>)}</ul>
                  <div className="btn-group"><button className="btn btn-outline" onClick={() => setEtape(null)}>Fermer</button></div>
                </>)}
                {etape === 'suivi' && (<>
                  <p style={{marginBottom: 10}}>Envoyée le {formatDate(f.efacture.deposeeLe)}{f.efacture.adresse ? ` à l'adresse ${f.efacture.adresse}` : ''}.</p>
                  {evs.length ? <ul className="suivi-liste">{evs.map((e, i) => <li key={i} className={STATUTS_ECHEC.includes(e.code) ? 'echec' : ''}><span className="date">{e.date ? new Date(e.date).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : ''}</span><span>{e.texte}{e.raison ? ` — ${e.raison}` : ''}</span></li>)}</ul>
                    : <p style={{marginBottom: 12, fontSize: 13}}>{f.efacture.envoiDirect ? 'Pas encore de statut.' : 'Déposée à la main sur Super PDP : le suivi se consulte dans votre compte Super PDP.'}</p>}
                  <div className="btn-group">
                    {direct && f.efacture.id && <button className="btn btn-outline" onClick={actualiser} disabled={actualisation}>{actualisation ? 'Actualisation…' : 'Actualiser'}</button>}
                    <button className="btn btn-outline" onClick={() => setEtape(null)}>Fermer</button>
                  </div>
                </>)}
                {etape === 'generation' && <p>Préparation du fichier…</p>}
                {etape === 'erreur' && (<>
                  <p style={{marginBottom: 8}}>L'opération n'a pas abouti.</p>
                  <p className="alerte-info">{msg}</p>
                  <p style={{marginTop: 8, fontSize: 13, color: 'var(--text-muted)'}}>Une connexion internet est nécessaire. Si la facture était en cours d'envoi, rouvrez cette fenêtre avant de réessayer : un renvoi ne crée jamais de doublon.</p>
                  <div className="btn-group"><button className="btn btn-outline" onClick={() => setEtape(null)}>Fermer</button></div>
                </>)}
                {etape === 'pret' && (<>
                  <p style={{marginBottom: 12}}>Le fichier <strong>{nomFichier}</strong> a été enregistré dans vos téléchargements.</p>
                  <ol style={{marginLeft: 20, marginBottom: 16, lineHeight: 1.8}}>
                    <li>Ouvrez votre compte <a href="https://www.superpdp.tech/app" target="_blank" rel="noopener">Super PDP</a>.</li>
                    <li>Envoyez une nouvelle facture en y déposant ce fichier, sans le modifier.</li>
                    <li>Revenez ici et cliquez sur « C'est déposé ».</li>
                  </ol>
                  <p style={{fontSize: 12, color: 'var(--text-muted)', marginBottom: 12}}>La facture passera en « Envoyée » et ne pourra plus être modifiée. Pour une correction, il faudra faire un avoir.</p>
                  <div className="btn-group">
                    <button className="btn btn-success" onClick={deposee}>{Icons.check} C'est déposé</button>
                    <button className="btn btn-outline" onClick={() => setEtape(null)}>Plus tard</button>
                  </div>
                </>)}
              </div>
            </div>
          )}
        </>
      );
    }

    // Page Suivi (fusion tableau de bord + suivi)
    function PageSuivi({ data, stats, setPage, updateData, showToast }) {
      const [showAEnvoyer, setShowAEnvoyer] = useState(true);
      const [showEnvoyees, setShowEnvoyees] = useState(true);
      const [showRetard, setShowRetard] = useState(true);
      const [showPayees, setShowPayees] = useState(false);
      const [showSansDate, setShowSansDate] = useState(true);
      const [paymentModal, setPaymentModal] = useState(null);
      const [viewFacture, setViewFacture] = useState(null);

      const exportJSON = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `facturier_backup_${ENTREPRISE === 'principale' ? '' : ENTREPRISE + '_'}${new Date().toISOString().split('T')[0]}.json`; a.click();
        showToast('Sauvegarde exportée');
      };

      const exportExcel = () => {
        const wb = XLSX.utils.book_new();
        const prodHeaders = ['Référence', 'Cuvée', 'Millésime', 'Contenance', 'Prix pro HT', 'Prix export HT', 'Prix particulier', 'Particulier saisi', 'Épuisé'];
        const prodRows = data.produits.map(p => { const px = prixProduit(p); return [p.reference, p.cuvee, p.millesime, p.contenance, px.pro ?? '', px.export ?? '', px.particulier ?? '', p.particulierTTC ? 'TTC' : 'HT', p.epuise ? 'oui' : '']; });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([prodHeaders, ...prodRows]), 'Produits');
        const clientHeaders = ['Numéro', 'Type', 'Raison sociale / Nom', 'Enseigne', 'SIREN', 'N° TVA', 'Vérifié VIES', 'Adresse', 'CP', 'Ville', 'Pays', 'Tél', 'Email'];
        const clientRows = data.clients.map(c => { const v = viesAJour(c); return [c.numero, c.type, c.nom, c.enseigne || '', c.siren || '', c.tvaIntra || '', v ? `${v.valide ? 'valide' : 'invalide'} le ${dateFr(v.date)}${v.consultation ? ' (' + v.consultation + ')' : ''}` : '', c.adresse, c.codePostal, c.ville, c.pays, c.telephone || c.portable, c.email]; });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([clientHeaders, ...clientRows]), 'Clients');
        const factHeaders = ['Numéro', 'Date', 'Client', 'Total HT', 'TVA', 'Total TTC', 'Statut', 'Échéance', 'Date paiement'];
        const factRows = data.factures.map(f => [f.numero, f.date, f.client?.nom, f.totalHT, f.totalTVA, f.totalTTC, f.statut, f.echeance, f.datePaiement]);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([factHeaders, ...factRows]), 'Factures');
        XLSX.writeFile(wb, `facturier_export_${ENTREPRISE === 'principale' ? '' : ENTREPRISE + '_'}${new Date().toISOString().split('T')[0]}.xlsx`);
        showToast('Export Excel généré');
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => importerSauvegarde(event.target.result, data, updateData, showToast);
          reader.readAsText(file);
        }
        e.target.value = '';
      };

      const changeStatut = (factureNumero, newStatut) => {
        const idx = data.factures.findIndex(f => f.numero === factureNumero);
        if (idx === -1) return;
        if (newStatut === 'payee') {
          setPaymentModal(idx);
        } else {
          const updated = [...data.factures];
          updated[idx] = { ...figerClient(updated[idx], data), statut: newStatut, datePaiement: null };
          updateData({ factures: updated });
          showToast('Statut mis à jour');
        }
      };

      const confirmPayment = (datePaiement) => {
        const updated = [...data.factures];
        updated[paymentModal] = { ...figerClient(updated[paymentModal], data), statut: 'payee', datePaiement };
        updateData({ factures: updated });
        setPaymentModal(null);
        showToast('Facture marquée comme payée');
      };

      const FactureList = ({ factures, showStatusSelect = true }) => (
        <div className="facture-detail-list">
          {factures.map(f => (
            <div key={f.numero} className="facture-detail-item">
              <div className="numero">{f.numero}</div>
              <div className="client">{nomAffiche(f.client) || '-'}</div>
              <div className="date">Éch: {formatDate(f.echeance)}</div>
              <div className="amount">{formatMoney(f.totalTTC)}</div>
              <div className="actions">
                <button className="btn btn-icon btn-ghost view" title="Voir" onClick={() => setViewFacture(f)}>{Icons.eye}</button>
                {showStatusSelect && (
                  <select className={`status-select ${getFactureStatut(f)}`} value={f.statut} onChange={e => changeStatut(f.numero, e.target.value)}>
                    <option value="emise">Émise</option>
                    <option value="envoyee">Envoyée</option>
                    <option value="payee">Payée</option>
                  </select>
                )}
              </div>
            </div>
          ))}
        </div>
      );

      // Vue facture depuis suivi
      if (viewFacture) {
        const f = viewFacture;
        const e = data.entreprise;
        return (
          <div>
            <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 20}}>
              <button className="btn btn-outline" onClick={() => setViewFacture(null)}>← Retour au suivi</button>
              <div className="btn-group" style={{marginTop: 0}}>
                <BoutonFacturX facture={f} data={data} updateData={updateData} showToast={showToast} />
                <button className="btn btn-primary" onClick={() => imprimerFacture(f, data)}>{Icons.printer} Imprimer</button>
              </div>
            </div>
            <FacturePreview facture={f} data={data} />
          </div>
        );
      }

      return (
        <div>
          <div className="page-header">
            <h1 className="page-title">Suivi</h1>
            <button className="btn btn-primary" onClick={() => setPage('factures')}>{Icons.plus} Nouvelle facture</button>
          </div>

          <div className="stats-grid">
            <div className="stat-card" style={{borderLeft: '4px solid #9333ea'}}>
              <div className="stat-value" style={{color: '#9333ea'}}>{stats.facturesAEnvoyer.length}</div>
              <div className="stat-label">À envoyer</div>
              <div className="stat-amount">{formatMoney(stats.totalAEnvoyer)}</div>
            </div>
            <div className="stat-card info">
              <div className="stat-value" style={{color: 'var(--info)'}}>{stats.facturesEnvoyees.length}</div>
              <div className="stat-label">En attente paiement</div>
              <div className="stat-amount" style={{color: 'var(--info)'}}>{formatMoney(stats.totalEnvoyees)}</div>
            </div>
            <div className="stat-card alert">
              <div className="stat-value" style={{color: 'var(--danger)'}}>{stats.facturesEnRetard.length}</div>
              <div className="stat-label">En retard</div>
              <div className="stat-amount" style={{color: 'var(--danger)'}}>{formatMoney(stats.totalEnRetard)}</div>
            </div>
            <div className="stat-card success">
              <div className="stat-value" style={{color: 'var(--success)'}}>{formatMoney(stats.totalRentrees)}</div>
              <div className="stat-label">Encaissé</div>
              <div className="stat-amount">{stats.facturesPayees.length} facture(s)</div>
            </div>
          </div>

          {/* Factures à envoyer */}
          {stats.facturesAEnvoyer.length > 0 && (
            <div className="card" style={{borderLeft: '4px solid #9333ea'}}>
              <div className="section-header" onClick={() => setShowAEnvoyer(!showAEnvoyer)}>
                <div className="card-title" style={{color: '#9333ea', marginBottom: 0}}>
                  📤 Factures à envoyer ({stats.facturesAEnvoyer.length}) - {formatMoney(stats.totalAEnvoyer)}
                </div>
                <span className="toggle">{showAEnvoyer ? Icons.chevronUp : Icons.chevronDown}</span>
              </div>
              {showAEnvoyer && <FactureList factures={stats.facturesAEnvoyer} />}
            </div>
          )}

          {/* Factures envoyées (en attente paiement) */}
          {stats.facturesEnvoyees.length > 0 && (
            <div className="card" style={{borderLeft: '4px solid var(--info)'}}>
              <div className="section-header" onClick={() => setShowEnvoyees(!showEnvoyees)}>
                <div className="card-title" style={{color: 'var(--info)', marginBottom: 0}}>
                  📬 En attente de paiement ({stats.facturesEnvoyees.length}) - {formatMoney(stats.totalEnvoyees)}
                </div>
                <span className="toggle">{showEnvoyees ? Icons.chevronUp : Icons.chevronDown}</span>
              </div>
              {showEnvoyees && <FactureList factures={stats.facturesEnvoyees} />}
            </div>
          )}

          {/* Factures en retard */}
          {stats.facturesEnRetard.length > 0 && (
            <div className="card" style={{borderLeft: '4px solid var(--danger)'}}>
              <div className="section-header" onClick={() => setShowRetard(!showRetard)}>
                <div className="card-title" style={{color: 'var(--danger)', marginBottom: 0}}>
                  ⚠️ Factures en retard ({stats.facturesEnRetard.length}) - {formatMoney(stats.totalEnRetard)}
                </div>
                <span className="toggle">{showRetard ? Icons.chevronUp : Icons.chevronDown}</span>
              </div>
              {showRetard && <FactureList factures={stats.facturesEnRetard} />}
            </div>
          )}

          {/* Factures payées */}
          {stats.facturesPayees.length > 0 && (
            <div className="card" style={{borderLeft: '4px solid var(--success)'}}>
              <div className="section-header" onClick={() => setShowPayees(!showPayees)}>
                <div className="card-title" style={{color: 'var(--success)', marginBottom: 0}}>
                  ✅ Factures payées ({stats.facturesPayees.length}) - {formatMoney(stats.totalRentrees)}
                </div>
                <span className="toggle">{showPayees ? Icons.chevronUp : Icons.chevronDown}</span>
              </div>
              {showPayees && <FactureList factures={stats.facturesPayees} showStatusSelect={false} />}
            </div>
          )}

          {/* Factures payées sans date */}
          {stats.facturesPayeesSansDate.length > 0 && (
            <div className="card" style={{borderLeft: '4px solid var(--warning)'}}>
              <div className="section-header" onClick={() => setShowSansDate(!showSansDate)}>
                <div className="card-title" style={{color: 'var(--warning)', marginBottom: 0}}>
                  📝 Payées sans date ({stats.facturesPayeesSansDate.length})
                </div>
                <span className="toggle">{showSansDate ? Icons.chevronUp : Icons.chevronDown}</span>
              </div>
              {showSansDate && (
                <div className="facture-detail-list">
                  {stats.facturesPayeesSansDate.map(f => (
                    <div key={f.numero} className="facture-detail-item">
                      <div className="numero">{f.numero}</div>
                      <div className="client">{nomAffiche(f.client) || '-'}</div>
                      <div className="date">{formatDate(f.date)}</div>
                      <div className="amount">{formatMoney(f.totalTTC)}</div>
                      <div className="actions">
                        <button className="btn btn-icon btn-ghost view" title="Voir" onClick={() => setViewFacture(f)}>{Icons.eye}</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {paymentModal !== null && <PaymentDateModal onConfirm={confirmPayment} onCancel={() => setPaymentModal(null)} />}
        </div>
      );
    }

    // Page Factures
    function PageFactures({ data, updateData, getNextNum, showToast }) {
      const [mode, setMode] = useState('list');
      const [tab, setTab] = useState('actives');
      const [currentFacture, setCurrentFacture] = useState(null);
      const [editIndex, setEditIndex] = useState(null);
      const [search, setSearch] = useState('');
      const [sortCol, setSortCol] = useState('date');
      const [sortDir, setSortDir] = useState('desc');
      const [filterStatut, setFilterStatut] = useState('');
      const [filterAnnee, setFilterAnnee] = useState('');
      const [filterClient, setFilterClient] = useState('');
      const [paymentModal, setPaymentModal] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [errors, setErrors] = useState({});
      const simple = estSimple(data);
      // Mode simple : chaque ligne est libre (intitulé + prix), comme le produit exceptionnel
      const ligneVide = () => simple ? { produitRef: REF_EXCEPTIONNEL, quantite: 1, prixHT: '', libelle: '', contenance: '' } : { produitRef: '', quantite: 1 };

      const [form, setForm] = useState({
        numero: '', clientId: '', date: new Date().toISOString().split('T')[0], echeance: '',
        lignes: [ligneVide()], tauxTVA: '', remise: 0,
        transporteur: '', plaque: '', prixTransport: '', statut: 'emise', reglement: 'virement', notes: ''
      });

      const factures = tab === 'actives' ? data.factures : data.facturesSupprimes;

      // Années disponibles
      const anneesDisponibles = [...new Set(data.factures.map(f => f.date?.substring(0, 4)).filter(Boolean))].sort().reverse();
      const clientsDisponibles = [...new Set(data.factures.map(f => f.clientId).filter(Boolean))];

      // Filtrage
      let filtered = factures.filter(f => {
        const searchLower = search.toLowerCase();
        const matchSearch = f.numero.toLowerCase().includes(searchLower) || (f.client && (`${f.client.nom || ''} ${f.client.enseigne || ''}`).toLowerCase().includes(searchLower));
        const realStatut = getFactureStatut(f);
        const matchStatut = !filterStatut || realStatut === filterStatut;
        const matchAnnee = !filterAnnee || f.date?.startsWith(filterAnnee);
        const matchClient = !filterClient || f.clientId === filterClient;
        return matchSearch && matchStatut && matchAnnee && matchClient;
      });

      // Tri
      filtered = [...filtered].sort((a, b) => {
        let valA = a[sortCol] || '';
        let valB = b[sortCol] || '';
        if (sortCol === 'totalTTC') { valA = parseFloat(valA) || 0; valB = parseFloat(valB) || 0; }
        else if (sortCol === 'client') { valA = nomAffiche(a.client); valB = nomAffiche(b.client); }
        if (typeof valA === 'string') { valA = valA.toLowerCase(); valB = valB.toLowerCase(); }
        if (valA < valB) return sortDir === 'asc' ? -1 : 1;
        if (valA > valB) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });

      const handleSort = (col) => {
        if (sortCol === col) setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
        else { setSortCol(col); setSortDir(col === 'date' ? 'desc' : 'asc'); }
      };

      const openCreate = () => {
        setEditIndex(null);
        setErrors({});
        setForm({
          numero: getNextNum(), clientId: '', date: new Date().toISOString().split('T')[0], echeance: '',
          lignes: [ligneVide()], tauxTVA: '', remise: 0,
          transporteur: '', plaque: '', prixTransport: '', statut: 'emise', reglement: 'virement', notes: ''
        });
        setMode('create');
      };

      const openEdit = (index) => {
        const f = data.factures[index];
        if (!canEditFacture(f)) {
          showToast('Changez d\'abord le statut en "Émise" pour modifier');
          return;
        }
        setEditIndex(index);
        setErrors({});
        setForm({ ...f });
        setMode('create');
      };

      const addLigne = () => setForm(prev => ({ ...prev, lignes: [...prev.lignes, ligneVide()] }));
      const removeLigne = (i) => setForm(prev => ({ ...prev, lignes: prev.lignes.filter((_, idx) => idx !== i) }));
      const clientForm = (f) => data.clients.find(c => c.numero === f.clientId);
      // Prix et libellé figés au moment du choix du produit, au tarif du client
      const ligneTarifee = (l, ref, f) => {
        const p = data.produits.find(x => x.reference === ref);
        if (!p) return { produitRef: '', quantite: l.quantite };
        return { produitRef: ref, quantite: l.quantite, ...tarifer(p, clientForm(f), f.tauxTVA), libelle: libelleProduit(p, (data.categorieDouanes || {})[p.cuvee]), contenance: p.contenance, ...(l.offerte ? { offerte: true } : {}) };
      };
      const updateLigne = (i, field, value) => setForm(prev => ({ ...prev, lignes: prev.lignes.map((l, idx) => {
        if (idx !== i) return l;
        if (field === 'produitRef') {
          if (value === REF_EXCEPTIONNEL) return { produitRef: value, quantite: l.quantite, prixHT: '', libelle: '', contenance: '' };
          return ligneTarifee(l, value, prev);
        }
        if (field === 'prixHT' && !estExceptionnel(l)) { const { ttc, repli, ...rest } = l; return { ...rest, prixHT: value, prixManuel: true }; }
        return { ...l, [field]: value };
      }) }));
      // Changer de client remet les lignes au tarif de ce client (sauf prix saisis à la main)
      const changerClient = (numero) => setForm(prev => {
        const f = { ...prev, clientId: numero };
        return { ...f, lignes: prev.lignes.map(l => (!l.produitRef || estExceptionnel(l) || l.prixManuel || !data.produits.some(x => x.reference === l.produitRef)) ? l : ligneTarifee(l, l.produitRef, f)) };
      });
      // Un prix particulier saisi TTC se recalcule HT avec le taux de TVA de la facture
      const changerTaux = (taux) => setForm(prev => ({ ...prev, tauxTVA: taux, lignes: prev.lignes.map(l => l.ttc !== undefined && !l.prixManuel ? { ...l, prixHT: horsTaxe(l.ttc, taux) } : l) }));

      const calculs = () => {
        const t = totauxFacture(form, data);
        return { vinHT: t.vinHT.toFixed(2), remiseHT: t.remiseHT.toFixed(2), transportHT: t.transportHT.toFixed(2), totalHT: t.totalHT.toFixed(2), totalTVA: t.totalTVA.toFixed(2), totalTTC: t.totalTTC.toFixed(2), nbBouteilles: t.nbBouteilles };
      };

      const validate = () => {
        const errs = {};
        if (!form.clientId) errs.clientId = 'Requis';
        if (!simple && !form.transporteur.trim()) errs.transporteur = 'Requis';
        if (!simple && !form.plaque.trim()) errs.plaque = 'Requis';
        if (!simple && (form.prixTransport === '' || form.prixTransport === null)) errs.prixTransport = 'Requis';
        if (form.tauxTVA === '' || form.tauxTVA === null) errs.tauxTVA = 'Requis';
        const rem = parseFloat(form.remise || 0) || 0;
        if (rem < 0 || rem > 100) errs.remise = 'Entre 0 et 100 %';
        if (!form.lignes.some(l => l.produitRef)) errs.lignes = 'Au moins un produit';
        else if (form.lignes.some(l => l.produitRef && !estExceptionnel(l) && (l.prixHT === '' || l.prixHT === undefined || isNaN(parseFloat(l.prixHT)) || parseFloat(l.prixHT) < 0)))
          errs.lignes = 'Prix unitaire manquant sur une ligne';
        else if (form.lignes.some(l => estExceptionnel(l) && (!String(l.libelle || '').trim() || l.prixHT === '' || isNaN(parseFloat(l.prixHT)) || parseFloat(l.prixHT) < 0)))
          errs.lignes = simple ? 'Chaque ligne : un intitulé et un prix' : 'Produit exceptionnel : indiquez un intitulé et un prix'
        setErrors(errs);
        return Object.keys(errs).length === 0;
      };

      const saveFacture = () => {
        if (!validate()) { showToast('Champs obligatoires manquants'); return; }
        const { vinHT, remiseHT, transportHT, totalHT, totalTVA, totalTTC, nbBouteilles } = calculs();
        const facture = { ...form, mode: estSimple(data) ? 'simple' : 'complet', lignes: figerLignes(form, data), client: data.clients.find(c => c.numero === form.clientId), vinHT, remiseHT, transportHT, totalHT, totalTVA, totalTTC, nbBouteilles, updatedAt: new Date().toISOString() };
        if (editIndex !== null) {
          const updated = [...data.factures]; updated[editIndex] = facture;
          updateData({ factures: updated });
          showToast('Facture modifiée');
        } else {
          facture.createdAt = new Date().toISOString();
          updateData({ factures: [...data.factures, facture] });
          showToast('Facture créée');
        }
        setCurrentFacture(facture);
        setMode('view');
      };

      const changeStatut = (index, newStatut) => {
        if (newStatut === 'payee') setPaymentModal(index);
        else {
          const updated = [...data.factures];
          updated[index] = { ...figerClient(updated[index], data), statut: newStatut, datePaiement: null };
          updateData({ factures: updated });
          showToast('Statut mis à jour');
        }
      };

      const confirmPayment = (datePaiement) => {
        const updated = [...data.factures];
        updated[paymentModal] = { ...figerClient(updated[paymentModal], data), statut: 'payee', datePaiement };
        updateData({ factures: updated });
        setPaymentModal(null);
        showToast('Facture payée');
      };

      const deleteFacture = () => {
        const f = data.factures[confirmDelete];
        updateData({
          factures: data.factures.filter((_, i) => i !== confirmDelete),
          facturesSupprimes: [...(data.facturesSupprimes || []), { ...f, deletedAt: new Date().toISOString() }]
        });
        showToast('Facture supprimée');
        setConfirmDelete(null);
      };

      const restoreFacture = (index) => {
        const f = data.facturesSupprimes[index];
        if (data.factures.some(x => x.numero === f.numero)) { showToast(`Impossible : une autre facture active porte déjà le n° ${f.numero}`); return; }
        const { deletedAt, ...rest } = f;
        updateData({
          facturesSupprimes: data.facturesSupprimes.filter((_, i) => i !== index),
          factures: [...data.factures, rest]
        });
        showToast('Facture restaurée');
      };

      const printFacture = () => imprimerFacture(currentFacture, data);

      const SortHeader = ({ col, children }) => (
        <th className={`sortable ${sortCol === col ? sortDir : ''}`} onClick={() => handleSort(col)}>{children}</th>
      );

      // Vue
      if (mode === 'view' && currentFacture) {
        const f = currentFacture;
        const e = data.entreprise;
        return (
          <div>
            <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 20}}>
              <button className="btn btn-outline" onClick={() => setMode('list')}>← Retour</button>
              <div className="btn-group" style={{marginTop: 0}}>
                {canEditFacture(currentFacture) && <button className="btn btn-outline" onClick={() => openEdit(data.factures.findIndex(x => x.numero === currentFacture.numero))}>{Icons.edit} Modifier</button>}
                <BoutonFacturX facture={currentFacture} data={data} updateData={updateData} showToast={showToast} />
                <button className="btn btn-primary" onClick={printFacture}>{Icons.printer} Imprimer</button>
              </div>
            </div>
            <FacturePreview facture={f} data={data} />
          </div>
        );
      }

      // Création/édition
      if (mode === 'create') {
        const { vinHT, remiseHT, transportHT, totalHT, totalTVA, totalTTC, nbBouteilles } = calculs();
        return (
          <div>
            <h1 className="page-title">{editIndex !== null ? 'Modifier' : 'Nouvelle'} facture</h1>
            <div className="card">
              <div className="card-title">Informations</div>
              <div className="form-grid">
                <div className="form-group"><label>N° Facture</label><input value={form.numero} disabled /></div>
                <div className={`form-group required ${errors.clientId ? 'error' : ''}`}>
                  <label>Client</label>
                  <ClientCombobox
                    clients={data.clients.filter(c => c.nom)}
                    value={form.clientId}
                    onChange={changerClient}
                    hasError={!!errors.clientId}
                  />
                  {(() => { const c = data.clients.find(x => x.numero === form.clientId); return c && typeClient(c) === 'pro' && estFrance(c) && !sirenValide(c.siren)
                    ? <div className="alerte-info">SIREN manquant pour ce client : à compléter dans sa fiche (onglet Clients) pour pouvoir produire la facture électronique.</div>
                    : c && clientUE(c) ? (!tvaNormalisee(c) ? <div className="alerte-info">N° de TVA manquant pour ce client de l'Union européenne : sans lui, la vente ne peut pas être faite sans TVA.</div>
                      : !viesAJour(c) ? <div className="alerte-info">N° de TVA de ce client pas encore vérifié dans VIES : vérifiez-le depuis sa fiche (onglet Clients).</div>
                      : !viesAJour(c).valide ? <div className="alerte-info">N° de TVA de ce client inconnu de VIES (vérifié le {dateFr(viesAJour(c).date)}) : à corriger avant de facturer sans TVA.</div>
                      : viesAJour(c).demandeur && viesAJour(c).demandeur !== String(data.entreprise.tvaIntra || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase()
                        ? <div className="alerte-info">N° de TVA vérifié par une autre de vos entreprises : revérifiez-le depuis la fiche du client pour avoir la preuve (n° de consultation) au nom de celle-ci.</div> : null) : null; })()}
                </div>
                <div className="form-group"><label>Date</label><input type="date" value={form.date} onChange={e => setForm({...form, date: e.target.value})} /></div>
                <div className="form-group"><label>Échéance</label><input type="date" value={form.echeance} onChange={e => setForm({...form, echeance: e.target.value})} /></div>
              </div>
            </div>
            {!simple && <div className="card">
              <div className="card-title">Transport</div>
              <div className="form-grid">
                <div className={`form-group required ${errors.transporteur ? 'error' : ''}`}>
                  <label>Transporteur / Client</label>
                  <input value={form.transporteur} onChange={e => setForm({...form, transporteur: e.target.value})} className={errors.transporteur ? 'error' : ''} />
                </div>
                <div className={`form-group required ${errors.plaque ? 'error' : ''}`}>
                  <label>Immatriculation</label>
                  <input value={form.plaque} onChange={e => setForm({...form, plaque: e.target.value})} className={errors.plaque ? 'error' : ''} placeholder="AB-123-CD" />
                </div>
                <div className={`form-group required ${errors.prixTransport ? 'error' : ''}`}>
                  <label>Frais transport (€ HT)</label>
                  <input type="number" min="0" step="0.01" value={form.prixTransport} onChange={e => setForm({...form, prixTransport: e.target.value})} className={errors.prixTransport ? 'error' : ''} />
                </div>
              </div>
            </div>}
            <div className="card">
              <div className="card-title">Produits {errors.lignes && <span className="error-msg">({errors.lignes})</span>}</div>
              <div className="ligne-entete"><span>{simple ? 'Intitulé' : 'Produit'}</span><span>Qté</span><span>Prix unit. HT</span><span>Montant HT</span><span></span></div>
              {simple && form.lignes.map((l, i) => (
                <div className="ligne-libre" key={i}>
                  <input value={l.libelle || ''} placeholder="Ce qui est facturé" onChange={e => updateLigne(i, 'libelle', e.target.value)} />
                  <input type="number" min="1" value={l.quantite} onChange={e => updateLigne(i, 'quantite', parseInt(e.target.value) || 1)} />
                  <input type="number" min="0" step="0.01" className="prix-ligne" value={l.prixHT ?? ''} onChange={e => updateLigne(i, 'prixHT', e.target.value)} />
                  <span style={{fontSize: 13, textAlign: 'right'}}>{l.prixHT !== '' && l.prixHT !== undefined ? `${round2((parseFloat(l.prixHT) || 0) * l.quantite).toFixed(2)} €` : ''}</span>
                  <button className="btn btn-icon btn-ghost delete" onClick={() => removeLigne(i)}>{Icons.trash}</button>
                </div>
              ))}
              {!simple && form.lignes.map((l, i) => {
                const exceptionnel = estExceptionnel(l);
                const produit = data.produits.find(x => x.reference === l.produitRef);
                const horsCatalogue = l.produitRef && !exceptionnel && !produit;
                const client = clientForm(form);
                const libTarif = { pro: 'Tarif pro', export: 'Tarif export', particulier: 'Tarif particulier' };
                const nomType = { export: 'export', particulier: 'particulier' };
                const prixLigne = lignesFacture({ lignes: [l] }, data)[0];
                return (
                  <div className="ligne-produit" key={i}>
                    <select value={l.produitRef} onChange={e => updateLigne(i, 'produitRef', e.target.value)}>
                      <option value="">-- Produit --</option>
                      {horsCatalogue && <option value={l.produitRef}>{l.produitRef} - {l.libelle} (hors catalogue)</option>}
                      {produit && produit.epuise && <option value={produit.reference}>{produit.reference} - {produit.cuvee} {produit.millesime} {produit.contenance} (épuisé)</option>}
                      {data.produits.filter(p => p.reference !== REF_EXCEPTIONNEL && !p.epuise).map(p => <option key={p.reference} value={p.reference}>{p.reference} - {p.cuvee} {p.millesime} {p.contenance} ({tarifer(p, client, form.tauxTVA).prixHT.replace(/(\.\d\d)\d+$/, '$1')} € HT)</option>)}
                      <option value={REF_EXCEPTIONNEL}>{REF_EXCEPTIONNEL} - Produit exceptionnel (intitulé et prix à saisir)</option>
                    </select>
                    <input type="number" min="1" value={l.quantite} onChange={e => updateLigne(i, 'quantite', parseInt(e.target.value) || 1)} />
                    <input type="number" min="0" step="0.01" className="prix-ligne" value={l.prixHT ?? ''} disabled={!l.produitRef || l.offerte} placeholder={exceptionnel ? 'Prix HT' : ''}
                      onChange={e => updateLigne(i, 'prixHT', e.target.value)} />
                    <span style={{fontSize: 13, textAlign: 'right'}}>{l.produitRef && prixLigne ? `${prixLigne.montantHT.toFixed(2)} €` : ''}</span>
                    <button className="btn btn-icon btn-ghost delete" onClick={() => removeLigne(i)}>{Icons.trash}</button>
                    {exceptionnel && (
                      <div className="ligne-exceptionnelle">
                        <input value={l.libelle || ''} placeholder="Intitulé (ex. : verres gravés, location de tireuse…)" onChange={e => updateLigne(i, 'libelle', e.target.value)} />
                      </div>
                    )}
                    {l.produitRef && !exceptionnel && (
                      <div className="ligne-info">
                        <span className={l.repli ? 'repli' : ''}>
                          {l.offerte ? 'Bouteilles offertes : 0 € sur la facture, comptées en bouteilles et en douane'
                            : l.prixManuel ? 'Prix modifié à la main'
                            : l.repli ? `Pas de tarif ${nomType[l.repli]} pour ce produit : prix pro appliqué`
                            : l.tarif ? <>{libTarif[l.tarif]}{l.ttc !== undefined && <> ({Number(l.ttc).toFixed(2)} € TTC)</>}</> : ''}
                        </span>
                        <label><input type="checkbox" checked={!!l.offerte} onChange={e => updateLigne(i, 'offerte', e.target.checked)} /> Offerte</label>
                      </div>
                    )}
                  </div>
                );
              })}
              <button className="btn btn-outline" onClick={addLigne} style={{marginTop: 8}}>{Icons.plus} Ajouter</button>
            </div>
            <div className="card">
              <div className="card-title">Facturation</div>
              <div className="form-grid">
                <div className={`form-group required ${errors.tauxTVA ? 'error' : ''}`}>
                  <label>Taux TVA</label>
                  <select value={form.tauxTVA} onChange={e => changerTaux(e.target.value)} className={errors.tauxTVA ? 'error' : ''}>
                    <option value="">-- Choisir --</option>
                    <option value="20">20 %</option>
                    <option value="10">10 %</option>
                    <option value="5.5">5,5 %</option>
                    <option value="0">0 % (Export)</option>
                  </select>
                </div>
                <div className="form-group"><label>Remise (%)</label><input type="number" min="0" max="100" value={form.remise} onChange={e => setForm({...form, remise: parseFloat(e.target.value) || 0})} /></div>
                <div className="form-group">
                  <label>Règlement</label>
                  <select value={form.reglement} onChange={e => setForm({...form, reglement: e.target.value})}>
                    <option value="virement">Virement</option>
                    <option value="chèque">Chèque</option>
                    <option value="espèces">Espèces</option>
                  </select>
                </div>
                {editIndex !== null && (
                  <div className="form-group"><label>Statut</label>
                    <input value="Émise" disabled style={{background: '#f0f0f0'}} />
                    <span style={{fontSize: 11, color: 'var(--text-muted)'}}>Modifiable depuis la liste</span>
                  </div>
                )}
              </div>
            </div>
            <div className="totaux-box">
              <div className="totaux-ligne"><span>{simple ? 'Sous-total HT' : 'Vin HT'}</span><span>{vinHT} €</span></div>
              {parseFloat(remiseHT) > 0 && <div className="totaux-ligne"><span>Remise {form.remise} %</span><span>-{remiseHT} €</span></div>}
              {!simple && <div className="totaux-ligne"><span>Transport HT</span><span>{transportHT} €</span></div>}
              <div className="totaux-ligne"><span>Total HT</span><span>{totalHT} €</span></div>
              <div className="totaux-ligne"><span>TVA ({form.tauxTVA || 0}%)</span><span>{totalTVA} €</span></div>
              <div className="totaux-ligne total"><span>Total TTC</span><span>{totalTTC} €</span></div>
              {!simple && <div style={{fontSize: 12, color: 'var(--text-muted)', marginTop: 8}}>Nb bouteilles: {nbBouteilles}</div>}
            </div>
            <div className="btn-group" style={{marginTop: 20}}>
              <button className="btn btn-primary" onClick={saveFacture}>{editIndex !== null ? 'Enregistrer' : 'Créer'}</button>
              <button className="btn btn-outline" onClick={() => setMode('list')}>Annuler</button>
            </div>
          </div>
        );
      }

      // Liste
      const enteteFactures = (<>
          <div className="page-header">
            <h1 className="page-title">Factures</h1>
            <button className="btn btn-primary" onClick={openCreate}>{Icons.plus} Nouvelle</button>
          </div>
          <div className="tabs">
            <button className={`tab ${tab === 'actives' ? 'active' : ''}`} onClick={() => setTab('actives')}>Actives ({data.factures.length})</button>
            {RELAIS && <button className={`tab ${tab === 'recues' ? 'active' : ''}`} onClick={() => setTab('recues')}>Reçues</button>}
            <button className={`tab ${tab === 'corbeille' ? 'active' : ''}`} onClick={() => setTab('corbeille')}>Corbeille ({(data.facturesSupprimes || []).length})</button>
          </div>
      </>);
      if (tab === 'recues' && RELAIS) return <div>{enteteFactures}<PageRecues showToast={showToast} integre /></div>;
      return (
        <div>
          {enteteFactures}
          <div className="search-bar"><input placeholder="Rechercher..." value={search} onChange={e => setSearch(e.target.value)} /></div>
          <div className="filters-row">
            <div className="filter-group">
              <label>Année</label>
              <select value={filterAnnee} onChange={e => setFilterAnnee(e.target.value)}>
                <option value="">Toutes</option>
                {anneesDisponibles.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
            </div>
            <div className="filter-group">
              <label>Client</label>
              <select value={filterClient} onChange={e => setFilterClient(e.target.value)}>
                <option value="">Tous</option>
                {clientsDisponibles.map(cId => {
                  const c = data.clients.find(x => x.numero === cId);
                  return <option key={cId} value={cId}>{nomAffiche(c) || cId}</option>;
                })}
              </select>
            </div>
            <div className="filter-group">
              <label>Statut</label>
              <select value={filterStatut} onChange={e => setFilterStatut(e.target.value)}>
                <option value="">Tous</option>
                <option value="emise">Émise</option>
                <option value="envoyee">Envoyée</option>
                <option value="payee">Payée</option>
                <option value="enretard">En retard</option>
              </select>
            </div>
          </div>
          {filtered.length === 0 ? (
            <div className="card"><div className="empty-state"><h3>Aucune facture</h3></div></div>
          ) : (
            <div className="card" style={{padding: 0, overflow: 'hidden'}}>
              <table>
                <thead>
                  <tr>
                    <SortHeader col="numero">N°</SortHeader>
                    <SortHeader col="date">Date</SortHeader>
                    <SortHeader col="client">Client</SortHeader>
                    <SortHeader col="totalTTC">Total TTC</SortHeader>
                    <th>Statut</th>
                    <th style={{width: 140}}>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((f, i) => {
                    const idx = data.factures.indexOf(f);
                    const idxSupp = (data.facturesSupprimes || []).indexOf(f);
                    const statut = getFactureStatut(f);
                    return (
                      <tr key={f.numero}>
                        <td className="ref-code">{f.numero}</td>
                        <td>{formatDate(f.date)}</td>
                        <td>{nomAffiche(f.client) || '-'}</td>
                        <td>{formatMoney(f.totalTTC)}</td>
                        <td>
                          {tab === 'actives' ? (
                            <>
                              <select className={`status-select ${statut}`} value={f.statut} onChange={e => changeStatut(idx, e.target.value)}>
                                <option value="emise">Émise</option>
                                <option value="envoyee">Envoyée</option>
                                <option value="payee">Payée</option>
                              </select>
                              {statut === 'enretard' && <span style={{marginLeft: 4, color: 'var(--danger)', fontSize: 10}}>⚠️</span>}
                              {f.efacture?.deposeeLe && <span className={`badge badge-efacture${efactureEnEchec(f) ? ' echec' : ''}`} title={`Déposée sur la plateforme le ${formatDate(f.efacture.deposeeLe)}${f.efacture.statutTexte ? ' — ' + f.efacture.statutTexte : ''}${f.efacture.raison ? ' : ' + f.efacture.raison : ''}`}>{efactureEnEchec(f) ? 'e-facture refusée' : 'e-facture'}</span>}
                            </>
                          ) : <span className="badge badge-emise">Supprimée</span>}
                        </td>
                        <td>
                          <div className="actions-cell">
                            {tab === 'actives' ? (
                              <>
                                <button className="btn btn-icon btn-ghost view" title="Voir" onClick={() => { setCurrentFacture(f); setMode('view'); }}>{Icons.eye}</button>
                                <button className="btn btn-icon btn-ghost edit" title="Modifier" onClick={() => openEdit(idx)} disabled={!canEditFacture(f)}>{Icons.edit}</button>
                                <button className="btn btn-icon btn-ghost delete" title="Supprimer" onClick={() => canDeleteFacture(f) ? setConfirmDelete(idx) : showToast('Passez d\'abord en "Émise"')}>{Icons.trash}</button>
                              </>
                            ) : (
                              <button className="btn btn-icon btn-ghost restore" title="Restaurer" onClick={() => restoreFacture(idxSupp)}>{Icons.restore}</button>
                            )}
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
          {paymentModal !== null && <PaymentDateModal onConfirm={confirmPayment} onCancel={() => setPaymentModal(null)} />}
          {confirmDelete !== null && <ConfirmModal title="Supprimer ?" message="La facture sera déplacée vers la corbeille." onConfirm={deleteFacture} onCancel={() => setConfirmDelete(null)} />}
        </div>
      );
    }

    // Page Produits
    function PageProduits({ data, updateData, getNextRef, showToast }) {
      const [tab, setTab] = useState('actifs');
      const [search, setSearch] = useState('');
      const [modal, setModal] = useState(null);
      const [editIndex, setEditIndex] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [isNouvelleCuvee, setIsNouvelleCuvee] = useState(false);
      const [sortCol, setSortCol] = useState('reference');
      const [sortDir, setSortDir] = useState('asc');
      const [voirEpuises, setVoirEpuises] = useState(false);

      const produits = tab === 'actifs' ? data.produits : data.produitsSupprimes;
      const nbEpuises = data.produits.filter(p => p.epuise).length;
      const valTri = (p) => ['pro', 'export', 'particulier'].includes(sortCol) ? (prixProduit(p)[sortCol] ?? -1) : String(p[sortCol] || '').toLowerCase();
      let filtered = produits.filter(p => {
        const s = search.toLowerCase();
        return (tab !== 'actifs' || voirEpuises || !p.epuise) && (p.reference.toLowerCase().includes(s) || p.cuvee.toLowerCase().includes(s) || String(p.millesime || '').includes(s));
      });
      filtered = [...filtered].sort((a, b) => {
        const valA = valTri(a), valB = valTri(b);
        if (valA < valB) return sortDir === 'asc' ? -1 : 1;
        if (valA > valB) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });
      const sansExport = data.produits.filter(p => !p.epuise && prixProduit(p).export === null).length;
      const sansParticulier = data.produits.filter(p => !p.epuise && prixProduit(p).particulier === null).length;
      const handleSort = (col) => { if (sortCol === col) setSortDir(sortDir === 'asc' ? 'desc' : 'asc'); else { setSortCol(col); setSortDir('asc'); } };
      const openAdd = () => {
        setEditIndex(null);
        setIsNouvelleCuvee(false);
        const defaultCuvee = data.cuvees[0] || '';
        setModal({
          reference: getNextRef(),
          cuvee: defaultCuvee,
          millesime: new Date().getFullYear().toString(),
          contenance: '75cl',
          prix: { pro: '', export: '', particulier: '' },
          particulierTTC: (data.options || {}).particulierTTC !== false,
          categorieDouanes: (data.categorieDouanes || {})[defaultCuvee] || ''
        });
      };
      // Nouveau millésime ou autre contenance d'une bouteille existante : mêmes cuvée et tarifs, nouvelle référence
      const dupliquer = (p) => {
        setEditIndex(null);
        setIsNouvelleCuvee(!data.cuvees.includes(p.cuvee));
        const { epuise, deletedAt, variante, descriptionOriginale, ...base } = migrerProduit(p);
        setModal({ ...base, reference: getNextRef(), prix: { ...base.prix }, categorieDouanes: (data.categorieDouanes || {})[p.cuvee] || '' });
      };
      const openEdit = (index) => {
        const p = migrerProduit(produits[index]);
        setEditIndex(index);
        setIsNouvelleCuvee(!data.cuvees.includes(p.cuvee));
        setModal({ ...p, prix: { ...p.prix }, categorieDouanes: (data.categorieDouanes || {})[p.cuvee] || '' });
      };
      const onCuveeChange = (newCuvee) => {
        // Sélection d'une cuvée existante → précharge sa catégorie
        setModal({ ...modal, cuvee: newCuvee, categorieDouanes: (data.categorieDouanes || {})[newCuvee] || '' });
      };
      const setPrix = (cle, v) => setModal(m => ({ ...m, prix: { ...m.prix, [cle]: v } }));
      const save = () => {
        if (!modal.cuvee || !modal.cuvee.trim()) { showToast('Cuvée requise'); return; }
        if (!modal.categorieDouanes) { showToast('Catégorie douanes requise'); return; }
        const px = prixProduit(modal);
        if (px.pro === null || px.pro < 0) { showToast('Prix pro requis'); return; }
        if ((px.export !== null && px.export < 0) || (px.particulier !== null && px.particulier < 0)) { showToast('Prix négatif'); return; }
        const { categorieDouanes, ...rest } = modal;
        const cuvee = modal.cuvee.trim();
        const fmt = (v) => v === null ? '' : v.toFixed(2);
        // prixHT reste le prix pro : les anciennes versions du Facturier le lisent encore
        const produit = { ...rest, cuvee, prix: { pro: fmt(px.pro), export: fmt(px.export), particulier: fmt(px.particulier) }, prixHT: fmt(px.pro) };
        const updates = { options: { ...(data.options || {}), particulierTTC: !!modal.particulierTTC } };
        if (!data.cuvees.includes(cuvee)) updates.cuvees = [...data.cuvees, cuvee];
        // La catégorie s'applique à toute la cuvée
        updates.categorieDouanes = { ...(data.categorieDouanes || {}), [cuvee]: categorieDouanes };
        if (editIndex !== null) {
          const updated = [...produits];
          updated[editIndex] = produit;
          updates[tab === 'actifs' ? 'produits' : 'produitsSupprimes'] = updated;
          updateData(updates);
          showToast('Produit modifié');
        } else {
          updates.produits = [...data.produits, produit];
          updateData(updates);
          showToast('Produit ajouté');
        }
        setModal(null);
      };
      const basculerEpuise = (p) => { updateData({ produits: data.produits.map(x => x === p ? { ...x, epuise: !x.epuise } : x) }); showToast(p.epuise ? 'Produit de nouveau en vente' : 'Produit marqué épuisé : il ne sera plus proposé dans les factures'); };
      const deleteProduit = () => { const p = data.produits[confirmDelete]; updateData({ produits: data.produits.filter((_, i) => i !== confirmDelete), produitsSupprimes: [...data.produitsSupprimes, { ...p, deletedAt: new Date().toISOString() }] }); showToast('Produit supprimé'); setConfirmDelete(null); };
      const restoreProduit = (index) => { const p = data.produitsSupprimes[index]; const { deletedAt, ...rest } = p; updateData({ produitsSupprimes: data.produitsSupprimes.filter((_, i) => i !== index), produits: [...data.produits, rest] }); showToast('Produit restauré'); };
      const SortHeader = ({ col, children, droite }) => <th className={`sortable ${sortCol === col ? sortDir : ''}`} style={droite ? {textAlign: 'right'} : null} onClick={() => handleSort(col)}>{children}</th>;
      const cellPrix = (p, cle) => { const t = texteTarif(p, cle); return <td style={{textAlign: 'right', whiteSpace: 'nowrap'}}>{t || <span style={{color: 'var(--text-muted)'}} title="Non renseigné : le prix pro s'applique">—</span>}</td>; };
