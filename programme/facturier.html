      const ttc = !!(modal && modal.particulierTTC);
      const tauxRef = 20;
      const apercuParticulier = modal && nombre(modal.prix.particulier) !== null
        ? (ttc ? `soit ${(nombre(modal.prix.particulier) / (1 + tauxRef / 100)).toFixed(2)} € HT à 20 %` : `soit ${(nombre(modal.prix.particulier) * (1 + tauxRef / 100)).toFixed(2)} € TTC à 20 %`) : 'Vide : le prix pro s\'applique';

      return (
        <div>
          <div className="page-header"><h1 className="page-title">Produits</h1><button className="btn btn-primary" onClick={openAdd}>{Icons.plus} Nouveau</button></div>
          <div className="tabs">
            <button className={`tab ${tab === 'actifs' ? 'active' : ''}`} onClick={() => setTab('actifs')}>En vente ({data.produits.length - nbEpuises})</button>
            <button className={`tab ${tab === 'corbeille' ? 'active' : ''}`} onClick={() => setTab('corbeille')}>Corbeille ({data.produitsSupprimes.length})</button>
          </div>
          <div className="search-bar"><input placeholder="Rechercher une cuvée, un millésime, une référence…" value={search} onChange={e => setSearch(e.target.value)} /></div>
          {tab === 'actifs' && (
            <div style={{display: 'flex', gap: 20, flexWrap: 'wrap', alignItems: 'center', margin: '-4px 0 14px', fontSize: 13}}>
              {nbEpuises > 0 && <label style={{display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer'}}><input type="checkbox" checked={voirEpuises} onChange={e => setVoirEpuises(e.target.checked)} /> Afficher les produits épuisés ({nbEpuises})</label>}
              {(sansExport > 0 || sansParticulier > 0) && <span style={{color: 'var(--text-muted)'}}>Sans tarif {[sansExport && `export : ${sansExport}`, sansParticulier && `particulier : ${sansParticulier}`].filter(Boolean).join(', ')} — le prix pro s'applique.</span>}
            </div>
          )}
          <div className="card" style={{padding: 0, overflow: 'hidden'}}>
            <table>
              <thead><tr><SortHeader col="reference">Réf.</SortHeader><SortHeader col="cuvee">Cuvée</SortHeader><SortHeader col="millesime">Mill.</SortHeader><SortHeader col="contenance">Cont.</SortHeader>
                <SortHeader col="pro" droite>Pro</SortHeader><SortHeader col="export" droite>Export</SortHeader><SortHeader col="particulier" droite>Particulier</SortHeader><th style={{width: 130}}>Actions</th></tr></thead>
              <tbody>
                {filtered.length === 0 ? <tr><td colSpan="8" style={{textAlign: 'center', padding: 40}}>Aucun produit</td></tr> : filtered.map((p, i) => (
                  <tr key={p.reference + i} className={p.epuise ? 'produit-epuise' : ''}>
                    <td className="ref-code">{p.reference}</td>
                    <td>{p.cuvee}{p.epuise && <span className="badge-epuise">épuisé</span>}</td>
                    <td>{p.millesime}</td><td>{p.contenance}</td>
                    {cellPrix(p, 'pro')}{cellPrix(p, 'export')}{cellPrix(p, 'particulier')}
                    <td><div className="actions-cell">
                      {tab === 'actifs' ? <>
                        <button className="btn btn-icon btn-ghost edit" title="Modifier" onClick={() => openEdit(data.produits.indexOf(p))}>{Icons.edit}</button>
                        <button className="btn btn-icon btn-ghost" title="Nouveau millésime ou autre contenance (copie de ce produit)" onClick={() => dupliquer(p)}>{Icons.plus}</button>
                        <button className="btn btn-icon btn-ghost" title={p.epuise ? 'Remettre en vente' : 'Marquer épuisé (n\'est plus proposé dans les factures)'} onClick={() => basculerEpuise(p)}>{p.epuise ? '↺' : '⦸'}</button>
                        <button className="btn btn-icon btn-ghost delete" title="Mettre à la corbeille" onClick={() => setConfirmDelete(data.produits.indexOf(p))}>{Icons.trash}</button>
                      </> : <button className="btn btn-icon btn-ghost restore" onClick={() => restoreProduit(data.produitsSupprimes.indexOf(p))}>{Icons.restore}</button>}
                    </div></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {modal && (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <div className="modal-header"><div className="modal-title">{editIndex !== null ? 'Modifier' : 'Nouveau'} produit</div><button className="close-btn" onClick={() => setModal(null)}>×</button></div>
                <div className="form-grid">
                  <div className="form-group"><label>Référence</label><input value={modal.reference} disabled /></div>
                  <div className="form-group required">
                    <label>Catégorie douanes de la cuvée</label>
                    <select value={modal.categorieDouanes || ''} onChange={e => setModal({...modal, categorieDouanes: e.target.value})} className={!modal.categorieDouanes ? 'select-empty' : ''}>
                      <option value="">— Choisir —</option>
                      {CATEGORIES_DOUANES.map(cat => <option key={cat.key} value={cat.key}>{cat.label}</option>)}
                    </select>
                  </div>
                  <div className="form-group full">
                    <label style={{display: 'flex', alignItems: 'center', gap: 8}}><input type="checkbox" checked={isNouvelleCuvee} onChange={e => { setIsNouvelleCuvee(e.target.checked); if (!e.target.checked) onCuveeChange(data.cuvees[0] || ''); else setModal({...modal, cuvee: '', categorieDouanes: ''}); }} /> Nouvelle cuvée</label>
                    {isNouvelleCuvee ? <input placeholder="Nom de la cuvée, sans millésime ni type de client" value={modal.cuvee} onChange={e => setModal({...modal, cuvee: e.target.value})} style={{marginTop: 8}} /> : <select value={modal.cuvee} onChange={e => onCuveeChange(e.target.value)} style={{marginTop: 8}}>{data.cuvees.map(c => <option key={c} value={c}>{c}</option>)}</select>}
                  </div>
                  <div className="form-group"><label>Millésime</label><input value={modal.millesime} placeholder="2025, ou 2023/2024 pour un assemblage" onChange={e => setModal({...modal, millesime: e.target.value})} /></div>
                  <div className="form-group"><label>Contenance</label>
                    <select value={modal.contenance} onChange={e => setModal({...modal, contenance: e.target.value})}>
                      <option value="37.5cl">37.5cl</option><option value="50cl">50cl</option><option value="75cl">75cl</option><option value="1L">1L</option><option value="150cl">150cl (Magnum)</option><option value="3L">3L (Jéroboam)</option>
                    </select>
                  </div>
                  <div className="tarifs-grille">
                    <div className="form-group required" style={{margin: 0}}><label>Prix pro (€ HT)</label>
                      <input type="number" min="0" step="0.01" value={modal.prix.pro} onChange={e => setPrix('pro', e.target.value)} />
                      <div className="aide">Clients professionnels en France</div></div>
                    <div className="form-group" style={{margin: 0}}><label>Prix export (€ HT)</label>
                      <input type="number" min="0" step="0.01" value={modal.prix.export} onChange={e => setPrix('export', e.target.value)} />
                      <div className="aide">{nombre(modal.prix.export) === null ? 'Vide : le prix pro s\'applique' : 'Clients export (UE et hors UE)'}</div></div>
                    <div className="form-group" style={{margin: 0}}><label>Prix particulier
                        <span className="bascule-ttc"><button type="button" className={ttc ? 'actif' : ''} onClick={() => setModal(m => ({...m, particulierTTC: true}))}>TTC</button><button type="button" className={!ttc ? 'actif' : ''} onClick={() => setModal(m => ({...m, particulierTTC: false}))}>HT</button></span></label>
                      <input type="number" min="0" step="0.01" value={modal.prix.particulier} onChange={e => setPrix('particulier', e.target.value)} />
                      <div className="aide">{apercuParticulier}</div></div>
                  </div>
                  {editIndex !== null && tab === 'actifs' && (
                    <div className="form-group full"><label style={{display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer'}}><input type="checkbox" checked={!!modal.epuise} onChange={e => setModal({...modal, epuise: e.target.checked})} /> Épuisé : ne plus le proposer dans les factures (il reste dans l'historique)</label></div>
                  )}
                </div>
                <div className="btn-group"><button className="btn btn-primary" onClick={save}>Enregistrer</button><button className="btn btn-outline" onClick={() => setModal(null)}>Annuler</button></div>
              </div>
            </div>
          )}
          {confirmDelete !== null && <ConfirmModal title="Supprimer ?" message="Le produit sera déplacé vers la corbeille. S'il est simplement épuisé, préférez « Marquer épuisé »." onConfirm={deleteProduit} onCancel={() => setConfirmDelete(null)} />}
        </div>
      );
    }

    // Autocomplétion adresse
    // Combobox de sélection client avec recherche
    function ClientCombobox({ clients, value, onChange, hasError }) {
      const [query, setQuery] = useState('');
      const [show, setShow] = useState(false);
      const [highlighted, setHighlighted] = useState(0);
      const wrapperRef = useRef(null);
      const inputRef = useRef(null);

      const selectedClient = clients.find(c => c.numero === value);

      useEffect(() => {
        const handleClick = (e) => {
          if (wrapperRef.current && !wrapperRef.current.contains(e.target)) {
            setShow(false);
            setQuery('');
          }
        };
        document.addEventListener('mousedown', handleClick);
        return () => document.removeEventListener('mousedown', handleClick);
      }, []);

      // Normalisation pour ignorer accents et casse
      const normalize = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const nQuery = normalize(query);

      const filtered = !query
        ? clients
        : clients.filter(c => normalize(c.nom).includes(nQuery) || normalize(c.enseigne).includes(nQuery) || normalize(c.numero).includes(nQuery) || normalize(c.ville || '').includes(nQuery));

      const displayed = filtered.slice(0, 50);

      const handleSelect = (client) => {
        onChange(client.numero);
        setShow(false);
        setQuery('');
        setHighlighted(0);
      };

      const handleKeyDown = (e) => {
        if (!show) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); setHighlighted(Math.min(highlighted + 1, displayed.length - 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setHighlighted(Math.max(highlighted - 1, 0)); }
        else if (e.key === 'Enter' && displayed[highlighted]) { e.preventDefault(); handleSelect(displayed[highlighted]); }
        else if (e.key === 'Escape') { setShow(false); setQuery(''); }
      };

      const handleClear = (e) => {
        e.stopPropagation();
        onChange('');
        setQuery('');
        if (inputRef.current) inputRef.current.focus();
      };

      const displayValue = show ? query : (selectedClient ? nomAffiche(selectedClient) : '');

      return (
        <div className="client-combobox" ref={wrapperRef}>
          <div className={`client-combobox-input ${hasError ? 'error' : ''}`}>
            <input
              ref={inputRef}
              type="text"
              value={displayValue}
              onChange={e => { setQuery(e.target.value); setShow(true); setHighlighted(0); }}
              onFocus={() => { setShow(true); setQuery(''); }}
              onKeyDown={handleKeyDown}
              placeholder="-- Rechercher un client (nom, code, ville) --"
            />
            {selectedClient && !show && (
              <button type="button" className="client-clear-btn" onClick={handleClear} title="Effacer">×</button>
            )}
          </div>
          {show && (
            <div className="client-suggestions">
              {displayed.length === 0 ? (
                <div style={{padding: 12, textAlign: 'center', color: 'var(--text-muted)'}}>Aucun client trouvé</div>
              ) : (
                <>
                  {displayed.map((c, i) => (
                    <div
                      key={c.numero}
                      className={`client-suggestion ${i === highlighted ? 'highlighted' : ''} ${c.numero === value ? 'selected' : ''}`}
                      onClick={() => handleSelect(c)}
                      onMouseEnter={() => setHighlighted(i)}
                    >
                      {nomAffiche(c)}
                      {enseigneDistincte(c) && <span style={{marginLeft: 8, fontSize: 11, color: 'var(--text-muted)'}}>{c.nom}</span>}
                    </div>
                  ))}
                  {filtered.length > displayed.length && (
                    <div style={{padding: 8, textAlign: 'center', fontSize: 11, color: 'var(--text-muted)', borderTop: '1px solid var(--border)'}}>
                      {filtered.length - displayed.length} autres résultats — affinez la recherche
                    </div>
                  )}
                </>
              )}
            </div>
          )}
        </div>
      );
    }

    function AddressAutocomplete({ onSelect, onForce, initialValue = '' }) {
      const [query, setQuery] = useState(initialValue);
      const [suggestions, setSuggestions] = useState([]);
      const [loading, setLoading] = useState(false);
      const [show, setShow] = useState(false);
      const [searched, setSearched] = useState(false);
      const timeoutRef = useRef(null);
      const wrapperRef = useRef(null);
      useEffect(() => { const handleClick = (e) => { if (wrapperRef.current && !wrapperRef.current.contains(e.target)) setShow(false); }; document.addEventListener('mousedown', handleClick); return () => document.removeEventListener('mousedown', handleClick); }, []);
      const search = async (q) => { if (q.length < 3) { setSuggestions([]); setSearched(false); return; } setLoading(true); try { const res = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&limit=5`); const data = await res.json(); setSuggestions(data.features?.map(f => ({ label: f.properties.label, name: f.properties.name, postcode: f.properties.postcode, city: f.properties.city })) || []); setSearched(true); } catch { setSuggestions([]); setSearched(true); } setLoading(false); };
      const handleChange = (e) => { setQuery(e.target.value); setShow(true); setSearched(false); if (timeoutRef.current) clearTimeout(timeoutRef.current); timeoutRef.current = setTimeout(() => search(e.target.value), 300); };
      const handleSelect = (s) => { setQuery(s.name); setShow(false); onSelect({ adresse: s.name, codePostal: s.postcode || '', ville: s.city || '' }); };
      const handleForce = () => { setShow(false); if (onForce) onForce(query); };
      return (
        <div className="address-autocomplete" ref={wrapperRef}>
          <input value={query} onChange={handleChange} onFocus={() => query.length >= 3 && setShow(true)} placeholder="Tapez une adresse..." />
          {show && (loading || suggestions.length > 0 || (searched && query.length >= 3 && onForce)) && (
            <div className="address-suggestions">
              {loading ? <div style={{padding: 12, textAlign: 'center'}}>Recherche...</div> : (
                <>
                  {suggestions.map((s, i) => <div key={i} className="address-suggestion" onClick={() => handleSelect(s)}><div className="main">{s.name}</div><div className="secondary">{s.postcode} {s.city}</div></div>)}
                  {searched && query.length >= 3 && onForce && (
                    <div className="address-suggestion address-force" onClick={handleForce}>
                      <div className="main">↪ Forcer « {query} »</div>
                      <div className="secondary">Adresse non reconnue par l'API (lieu-dit, etc.) — saisie manuelle</div>
                    </div>
                  )}
                </>
              )}
            </div>
          )}
        </div>
      );
    }

    // Champ « Raison sociale » qui interroge l'annuaire officiel des entreprises (Sirene, via recherche-entreprises.api.gouv.fr)
    const rueSirene = (x) => {
      const rue = [x.numero_voie, x.indice_repetition, x.type_voie, x.libelle_voie].filter(Boolean).join(' ').trim();
      if (rue) return [rue, x.complement_adresse].filter(Boolean).join(', ');
      return String(x.adresse || '').replace(/\s*\d{5}\s+[^,]*$/, '').trim();
    };
    const lieuSirene = (x) => {
      const m = String(x.adresse || '').match(/(\d{5})\s+([^,]+)$/);
      return { codePostal: x.code_postal || (m ? m[1] : ''), ville: x.libelle_commune || (m ? m[2].trim() : '') };
    };
    const resultatSirene = (r) => {
      const sg = r.siege || {};
      const etab = (r.matching_etablissements || []).filter(e => !e.est_siege && e.etat_administratif !== 'F').map(e => ({
        adresse: rueSirene(e), ...lieuSirene(e), enseigne: (e.liste_enseignes || []).join(', ')
      })).filter(e => e.adresse);
      return {
        siren: r.siren, nom: r.nom_raison_sociale || r.nom_complet, nomComplet: r.nom_complet, actif: r.etat_administratif === 'A',
        enseigne: (sg.liste_enseignes || [])[0] || (r.matching_etablissements || []).flatMap(e => e.liste_enseignes || [])[0] || '',
        adresse: rueSirene(sg), ...lieuSirene(sg), enseignes: (sg.liste_enseignes || []).join(', '), etablissements: etab
      };
    };

    function RechercheAnnuaire({ initiale, codePostal, onChoisir, onManuel }) {
      const [q, setQ] = useState(initiale || '');
      const [res, setRes] = useState([]);
      const [show, setShow] = useState(false);
      const [loading, setLoading] = useState(false);
      const [erreur, setErreur] = useState('');
      const timer = useRef(null);
      const wrap = useRef(null);
      useEffect(() => { const h = (e) => { if (wrap.current && !wrap.current.contains(e.target)) setShow(false); }; document.addEventListener('mousedown', h); return () => document.removeEventListener('mousedown', h); }, []);
      const chercher = async (texte) => {
        if (!texte || texte.trim().length < 3) { setRes([]); return; }
        setLoading(true); setErreur('');
        try {
          const r = await fetch(`https://recherche-entreprises.api.gouv.fr/search?${new URLSearchParams({ q: texte.trim(), per_page: '8' })}`);
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          let liste = ((await r.json()).results || []).map(resultatSirene);
          const dep = String(codePostal || '').slice(0, 2);
          if (dep) liste = [...liste.filter(x => x.codePostal.startsWith(dep)), ...liste.filter(x => !x.codePostal.startsWith(dep))];
          setRes(liste);
        } catch { setRes([]); setErreur("Annuaire injoignable pour le moment."); }
        setLoading(false);
      };
      const taper = (v) => { setQ(v); setShow(true); clearTimeout(timer.current); timer.current = setTimeout(() => chercher(v), 400); };
      return (
        <div className="address-autocomplete" ref={wrap}>
          <div style={{display: 'flex', gap: 8}}>
            <input value={q} onChange={e => taper(e.target.value)} onFocus={() => { if (q.length >= 3) { setShow(true); if (!res.length && !loading) chercher(q); } }}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); setShow(true); chercher(q); } }}
              placeholder="Raison sociale, enseigne ou SIREN…" style={{flex: 1}} />
            <button type="button" className="btn btn-outline" onClick={() => { setShow(true); chercher(q); }} disabled={loading}>{loading ? 'Recherche…' : 'Chercher'}</button>
          </div>
          {show && (loading || res.length > 0 || erreur || q.length >= 3) && (
            <div className="address-suggestions">
              {loading ? <div style={{padding: 12, textAlign: 'center'}}>Recherche dans l'annuaire des entreprises…</div> : (<>
                {erreur && <div style={{padding: 10, color: 'var(--danger)', fontSize: 12}}>{erreur}</div>}
                {res.map(x => (
                  <div key={x.siren} className="address-suggestion" onClick={() => { onChoisir(x); setShow(false); setQ(''); setRes([]); }}>
                    <div className="main">{x.nom}{x.enseigne && normNom(x.enseigne) !== normNom(x.nom) && <span className="sirene-enseigne">{x.enseigne}</span>}{!x.actif && <span className="sirene-fermee">fermée</span>}</div>
                    <div className="secondary">{x.adresse}, {x.codePostal} {x.ville} — SIREN {x.siren}</div>
                  </div>
                ))}
                {onManuel && (
                  <div className="address-suggestion address-force" onClick={() => { onManuel(); setShow(false); }}>
                    <div className="main">↪ Introuvable dans l'annuaire : saisir à la main</div>
                    <div className="secondary">Raison sociale, enseigne et SIREN deviennent modifiables</div>
                  </div>
                )}
              </>)}
            </div>
          )}
        </div>
      );
    }

    // Bloc adresse réutilisable (facturation ou livraison) : recherche Base Adresse Nationale ou saisie libre
    function AdresseBloc({ valeur, onChange, titre }) {
      const [manuel, setManuel] = useState(!!valeur.adresse || !estFrance(valeur));
      const fr = estFrance(valeur);
      return (<>
        {fr && !manuel ? (
          <div className="form-group full"><label>{titre}</label>
            <AddressAutocomplete initialValue={valeur.adresse} onSelect={({ adresse, codePostal, ville }) => { onChange({ ...valeur, adresse, codePostal, ville }); setManuel(true); }}
              onForce={(a) => { setManuel(true); onChange({ ...valeur, adresse: a }); }} />
            <span className="manual-toggle" onClick={() => setManuel(true)}>✏️ Saisir manuellement</span>
          </div>
        ) : (<>
          <div className="form-group full"><label>{titre}</label>
            <input value={valeur.adresse || ''} onChange={e => onChange({ ...valeur, adresse: e.target.value })} />
            {fr && <span className="manual-toggle" onClick={() => setManuel(false)}>🔍 Rechercher l'adresse</span>}
          </div>
          <div className="form-group"><label>Code postal</label><input value={valeur.codePostal || ''} onChange={e => onChange({ ...valeur, codePostal: e.target.value })} /></div>
          <div className="form-group"><label>Ville</label><input value={valeur.ville || ''} onChange={e => onChange({ ...valeur, ville: e.target.value })} /></div>
        </>)}
        <div className="form-group"><label>Pays</label><input value={valeur.pays || ''} onChange={e => { onChange({ ...valeur, pays: e.target.value }); if (!estFrance({ pays: e.target.value })) setManuel(true); }} /></div>
      </>);
    }

    // Vérification d'un n° de TVA intracommunautaire dans VIES (registre de la Commission européenne)
    function VerifVies({ client, demandeur, onResultat, onReprendre }) {
      const [charge, setCharge] = useState(false);
      const [erreur, setErreur] = useState('');
      const [note, setNote] = useState('');
      const num = tvaNormalisee(client);
      const v = viesAJour(client);
      const verifier = async () => {
        setCharge(true); setErreur(''); setNote('');
        try {
          const { vies, demandeurRefuse } = await verifierVies(num, demandeur);
          onResultat(vies);
          if (demandeurRefuse) setNote("Vérifié sans n° de consultation : votre propre n° de TVA (Paramètres) n'est pas reconnu par VIES.");
          else if (!demandeur) setNote("Sans votre n° de TVA dans Paramètres, VIES ne délivre pas de n° de consultation (la preuve de vérification).");
        } catch (e) { setErreur(e.message); }
        setCharge(false);
      };
      if (!num) return <div className="vies vies-neutre">Pas encore de n° de TVA : il est indispensable pour vendre sans TVA à un professionnel de l'Union européenne. Demandez-le au client.</div>;
      const bouton = RELAIS
        ? <button type="button" className="lien" onClick={verifier} disabled={charge}>{charge ? 'Vérification…' : (v ? 'Revérifier' : 'Vérifier dans VIES')}</button>
        : <a className="lien" href="https://ec.europa.eu/taxation_customs/vies/#/vat-validation" target="_blank" rel="noreferrer">Vérifier sur le site VIES</a>;
      return (<>
        {!v && <div className="vies vies-neutre">N° {num} pas encore vérifié. <div className="vies-actions">{bouton}</div></div>}
        {v && v.valide && (
          <div className="vies vies-ok">
            <strong>✓ N° valide</strong> selon VIES, vérifié le {dateFr(v.date)}{v.consultation && <> — n° de consultation <strong>{v.consultation}</strong></>}
            {(v.nom || v.adresse) ? <div>Enregistré au nom de : {v.nom || '(nom non communiqué)'}{v.adresse && <>, {v.adresse.replace(/\n/g, ', ')}</>}</div>
              : <div>Ce pays ne communique ni le nom ni l'adresse : vérifiez qu'ils correspondent bien à votre client.</div>}
            <div className="vies-actions">{v.nom && onReprendre && <button type="button" className="lien" onClick={() => onReprendre(v)}>Reprendre ce nom et cette adresse</button>}{bouton}</div>
          </div>
        )}
        {v && !v.valide && (
          <div className="vies vies-ko">
            <strong>✗ N° inconnu de VIES</strong> le {dateFr(v.date)}. Vérifiez-le auprès du client : un n° valide est une condition de la vente sans TVA dans l'Union européenne.
            <div className="vies-actions">{bouton}</div>
          </div>
        )}
        {note && <div className="vies vies-neutre">{note}</div>}
        {erreur && <div className="vies vies-ko">{erreur}</div>}
      </>);
    }

    // Page Clients
    function PageClients({ data, updateData, getNextNum, showToast }) {
      const [tab, setTab] = useState('actifs');
      const [search, setSearch] = useState('');
      const [modal, setModal] = useState(null);
      const [editIndex, setEditIndex] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [manualAddress, setManualAddress] = useState(false);
      const [sortCol, setSortCol] = useState('numero');
      const [sortDir, setSortDir] = useState('asc');
      const [sansSiren, setSansSiren] = useState(false);
      const [etabs, setEtabs] = useState([]);
      const [verifTous, setVerifTous] = useState(null);
      const ctxEnt = React.useContext(EntrepriseCtx);
      // Entreprises où chaque client a des factures (les autres entreprises sont lues par le programme local)
      const [usageAutres, setUsageAutres] = useState({});
      useEffect(() => { if (RELAIS && ctxEnt.liste.length > 1) appelRelais('/api/clients/usage').then(r => setUsageAutres(r.usage || {})).catch(() => {}); }, [ctxEnt.liste.length]);
      const usage = (numero) => {
        const ids = new Set((usageAutres[numero] || []).filter(id => id !== ctxEnt.active));
        if ([...data.factures, ...(data.facturesSupprimes || [])].some(f => f.clientId === numero)) ids.add(ctxEnt.active);
        return ctxEnt.liste.filter(e => ids.has(e.id));
      };
      const sigle = (e) => { const n = (e.nom || '').toUpperCase(); return /\bEI\b/.test(n) ? 'EI' : /^(SAS|SARL|EURL|SA|SCEA|EARL|GAEC)\b/.test(n) ? n.split(' ')[0] : (e.id === 'principale' ? 'Principale' : (e.nom || e.id).slice(0, 12)); };
      const clients = tab === 'actifs' ? data.clients : data.clientsSupprimes;
      const clientsUE = data.clients.filter(c => c.nom && clientUE(c));
      const lancerVerifTous = async () => {
        const maj = [...data.clients];
        const resultats = [];
        setVerifTous({ enCours: true, total: clientsUE.length, resultats: [] });
        for (const c of clientsUE) {
          const num = tvaNormalisee(c);
          if (!num) resultats.push({ c, statut: 'manquant' });
          else {
            try {
              const { vies } = await verifierVies(num, data.entreprise.tvaIntra);
              const i = maj.findIndex(x => x.numero === c.numero);
              maj[i] = { ...maj[i], tvaIntra: num, vies };
              resultats.push({ c, statut: vies.valide ? 'valide' : 'invalide', vies });
            } catch (e) { resultats.push({ c, statut: 'erreur', texte: e.message }); }
            await new Promise(r => setTimeout(r, 700));
          }
          setVerifTous(v => ({ ...v, resultats: [...resultats] }));
        }
        updateData({ clients: maj });
        setVerifTous(v => ({ ...v, enCours: false }));
      };
      const manqueSiren = (c) => typeClient(c) === 'pro' && estFrance(c) && !sirenValide(c.siren);
      const nbSansSiren = data.clients.filter(c => c.nom && manqueSiren(c)).length;
      let filtered = clients.filter(c => c.nom && (c.nom.toLowerCase().includes(search.toLowerCase()) || (c.enseigne || '').toLowerCase().includes(search.toLowerCase()) || c.numero.toLowerCase().includes(search.toLowerCase()) || (c.siren || '').includes(search)) && (!sansSiren || manqueSiren(c)));
      const valTri = (c) => (sortCol === 'nom' ? nomAffiche(c) : (c[sortCol] || '')).toLowerCase();
      filtered = [...filtered].sort((a, b) => { let valA = valTri(a); let valB = valTri(b); if (valA < valB) return sortDir === 'asc' ? -1 : 1; if (valA > valB) return sortDir === 'asc' ? 1 : -1; return 0; });
      const handleSort = (col) => { if (sortCol === col) setSortDir(sortDir === 'asc' ? 'desc' : 'asc'); else { setSortCol(col); setSortDir('asc'); } };
      const getTypeBadge = (type) => { const t = (type || '').toLowerCase(); if (t.includes('export')) return <span className="badge badge-export">Export</span>; if (t.includes('pro')) return <span className="badge badge-pro">Pro</span>; return <span className="badge badge-particulier">Particulier</span>; };
      const openAdd = () => { setEtabs([]); setEditIndex(null); setManualAddress(false); setModal({ numero: getNextNum(), type: 'Pro', nom: '', adresse: '', codePostal: '', ville: '', pays: 'France', telephone: '', portable: '', email: '', remarques: '' }); };
      const openEdit = (index) => { setEtabs([]); setEditIndex(index); setManualAddress(true); setModal({ ...clients[index] }); };
      const save = () => {
        const siren = chiffres(modal.siren);
        if (modal.siren && estFrance(modal) && typeClient(modal) !== 'particulier' && !sirenValide(siren)) { showToast('SIREN invalide : 9 chiffres attendus (clé de contrôle fausse)'); return; }
        const particulier = typeClient(modal) === 'particulier';
        if (!String(modal.nom || '').trim()) { showToast(particulier ? 'Nom manquant' : "Raison sociale manquante : cherchez l'entreprise dans l'annuaire"); return; }
        const { _cle, _cleL, _ancienneGardee, ...rest } = modal;
        const livraison = modal.livraison && modal.livraison.adresse ? modal.livraison : null;
        const enseigne = particulier ? '' : (String(modal.enseigne || '').trim() || modal.nom);
        const client = { ...rest, siren, enseigne, livraison, tvaIntra: estFrance(modal) ? (modal.tvaIntra || '').replace(/\s/g, '').toUpperCase() : tvaNormalisee(modal),
          uid: rest.uid || (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 16) : Math.random().toString(16).slice(2) + Date.now().toString(16)) };
        if (editIndex !== null) { const updated = [...clients]; updated[editIndex] = client; updateData({ clients: updated }); showToast('Client modifié'); } else { updateData({ clients: [...data.clients, client] }); showToast('Client ajouté'); } setModal(null);
      };
      const demanderSuppression = (index) => {
        const u = usage(data.clients[index].numero);
        if (u.length) { showToast(`Ce client a des factures (${u.map(sigle).join(', ')}) : il ne peut pas aller à la corbeille`); return; }
        setConfirmDelete(index);
      };
      const deleteClient = () => { const c = data.clients[confirmDelete]; updateData({ clients: data.clients.filter((_, i) => i !== confirmDelete), clientsSupprimes: [...data.clientsSupprimes, { ...c, deletedAt: new Date().toISOString() }] }); showToast('Client supprimé'); setConfirmDelete(null); };
      const restoreClient = (index) => { const c = data.clientsSupprimes[index]; const { deletedAt, ...rest } = c; updateData({ clientsSupprimes: data.clientsSupprimes.filter((_, i) => i !== index), clients: [...data.clients, rest] }); showToast('Client restauré'); };
      const SortHeader = ({ col, children }) => <th className={`sortable ${sortCol === col ? sortDir : ''}`} onClick={() => handleSort(col)}>{children}</th>;

      return (
        <div>
          <div className="page-header"><h1 className="page-title">Clients</h1><div className="btn-group" style={{marginTop: 0}}>
            <button className="btn btn-primary" onClick={openAdd}>{Icons.plus} Nouveau</button></div></div>

          <div className="tabs">
            <button className={`tab ${tab === 'actifs' ? 'active' : ''}`} onClick={() => setTab('actifs')}>Actifs ({data.clients.filter(c => c.nom).length})</button>
            <button className={`tab ${tab === 'corbeille' ? 'active' : ''}`} onClick={() => setTab('corbeille')}>Corbeille ({data.clientsSupprimes.length})</button>
          </div>
          <div className="search-bar"><input placeholder="Rechercher un nom, une enseigne, un code ou un SIREN…" value={search} onChange={e => setSearch(e.target.value)} /></div>
          {tab === 'actifs' && nbSansSiren > 0 && (
            <label className="siren-filtre">
              <input type="checkbox" checked={sansSiren} onChange={e => setSansSiren(e.target.checked)} />
              Afficher seulement les clients pros sans SIREN ({nbSansSiren}) — nécessaire pour la facture électronique
            </label>
          )}
          {tab === 'actifs' && clientsUE.length > 0 && RELAIS && (
            <div style={{margin: '-4px 0 14px'}}>
              <button className="btn btn-outline" onClick={lancerVerifTous}>Vérifier les n° de TVA des clients de l'Union européenne ({clientsUE.length})</button>
            </div>
          )}
          <div className="card" style={{padding: 0, overflow: 'hidden'}}>
            <table>
              <thead><tr><SortHeader col="numero">Code</SortHeader><SortHeader col="type">Type</SortHeader><SortHeader col="nom">Nom</SortHeader><SortHeader col="ville">Ville</SortHeader><SortHeader col="siren">SIREN / TVA</SortHeader><th style={{width: 100}}>Actions</th></tr></thead>
              <tbody>
                {filtered.length === 0 ? <tr><td colSpan="6" style={{textAlign: 'center', padding: 40}}>Aucun client</td></tr> : filtered.map((c, i) => (
                  <tr key={c.numero + i}><td className="ref-code">{c.numero}</td><td>{getTypeBadge(c.type)}</td><td>{nomAffiche(c)}{ctxEnt.liste.length > 1 && usage(c.numero).map(e => <span key={e.id} className="badge-entreprise" style={{background: COULEURS_ENTREPRISE[ctxEnt.liste.indexOf(e) % COULEURS_ENTREPRISE.length]}} title={`A des factures chez ${e.nom}`}>{sigle(e)}</span>)}{enseigneDistincte(c) && <div className="nom-legal">{c.nom}</div>}</td><td>{c.ville}</td>
                    <td className="ref-code">{clientUE(c) ? (() => { const v = viesAJour(c); const n = tvaNormalisee(c);
                        if (!n) return <span className="siren-manquant" title="N° de TVA nécessaire pour vendre sans TVA">TVA à demander</span>;
                        return <>{n} {v ? (v.valide ? <span className="tva-ok" title={`Valide selon VIES le ${dateFr(v.date)}`}>✓</span> : <span className="tva-ko" title={`Inconnu de VIES le ${dateFr(v.date)}`}>✗</span>) : <span className="tva-attente" title="Pas encore vérifié dans VIES">à vérifier</span>}</>; })()
                      : c.siren ? c.siren : (manqueSiren(c) ? <span className="siren-manquant" title="SIREN nécessaire pour la facture électronique">à compléter</span> : '')}</td>
                    <td><div className="actions-cell">
                      {tab === 'actifs' ? <><button className="btn btn-icon btn-ghost edit" onClick={() => openEdit(data.clients.indexOf(c))}>{Icons.edit}</button><button className="btn btn-icon btn-ghost delete" onClick={() => demanderSuppression(data.clients.indexOf(c))}>{Icons.trash}</button></> : <button className="btn btn-icon btn-ghost restore" onClick={() => restoreClient(data.clientsSupprimes.indexOf(c))}>{Icons.restore}</button>}
                    </div></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {modal && (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <div className="modal-header"><div className="modal-title">{editIndex !== null ? 'Modifier' : 'Nouveau'} client</div><button className="close-btn" onClick={() => setModal(null)}>×</button></div>
                <div className="form-grid">
                  <div className="form-group"><label>Code</label><input value={modal.numero} disabled /></div>
                  <div className="form-group"><label>Type</label><select value={{ pro: 'Pro', particulier: 'Particulier', export: 'Export' }[typeClient(modal)]} onChange={e => setModal({...modal, type: e.target.value})}><option value="Pro">Professionnel</option><option value="Particulier">Particulier</option><option value="Export">Export</option></select></div>
                  {(() => {
                    const pro = typeClient(modal) === 'pro' && estFrance(modal);
                    const part = typeClient(modal) === 'particulier';
                    const verrou = pro && !modal.saisieManuelle;
                    const sirenFaux = modal.siren && !sirenValide(chiffres(modal.siren));
                    return (<>
                      {pro && (
                        <div className="form-group full"><label>Rechercher dans l'annuaire des entreprises</label>
                          <RechercheAnnuaire key={`ann-${modal.numero}`} initiale={modal.annuaire ? '' : nomAffiche(modal)} codePostal={modal.codePostal}
                            onManuel={() => setModal(m => ({...m, saisieManuelle: true, annuaire: false}))}
                            onChoisir={(x) => { setModal(m => {
                              // L'ancien nom (nom d'usage de Simon) sert d'enseigne si l'annuaire n'en donne pas ; l'ancienne adresse devient l'adresse de livraison
                              const ancienNom = m.annuaire ? '' : (m.enseigne || m.nom || '');
                              const nomUsage = ancienNom && normNom(ancienNom) !== normNom(x.nom) ? ancienNom : '';
                              const ancienne = m.adresse && normNom(m.adresse) !== normNom(x.adresse) && !m.livraison
                                ? { nom: nomUsage, adresse: m.adresse, codePostal: m.codePostal, ville: m.ville, pays: m.pays || 'France' } : null;
                              return {...m, nom: x.nom, enseigne: x.enseigne || nomUsage || x.nom, siren: x.siren, tvaIntra: tvaDepuisSiren(x.siren),
                                annuaire: true, saisieManuelle: false, adresse: x.adresse, codePostal: x.codePostal, ville: x.ville, pays: 'France',
                                livraison: ancienne || m.livraison || null, _ancienneGardee: !!ancienne, _cle: (m._cle || 0) + 1, _cleL: (m._cleL || 0) + 1 };
                            }); setEtabs(x.etablissements || []); }} />
                          {modal._ancienneGardee && <div className="alerte-info">L'adresse précédente de ce client a été conservée comme adresse de livraison : vérifiez-la ou décochez « Livrer à une autre adresse ».</div>}
                        </div>
                      )}
                      <div className="cartouche cartouche-legale">
                        <div className="cartouche-titre">{part ? 'Client' : 'Informations légales'}</div>
                        <div className="form-grid">
                          <div className="form-group full"><label>{part ? 'Nom' : 'Raison sociale'}</label>
                            <input value={modal.nom || ''} readOnly={verrou} placeholder={verrou ? "Remplie par l'annuaire" : ''} onChange={e => setModal({...modal, nom: e.target.value})} /></div>
                          {!part && <div className="form-group full"><label>Enseigne</label>
                            <input value={modal.enseigne || ''} readOnly={verrou} placeholder={verrou ? "Remplie par l'annuaire" : 'Nom commercial ; à défaut, la raison sociale'} onChange={e => setModal({...modal, enseigne: e.target.value})} /></div>}
                          {!part && (<>
                            {estFrance(modal) && <div className={`form-group ${sirenFaux ? 'error' : ''}`}><label>SIREN</label>
                              <input value={modal.siren || ''} readOnly={verrou} maxLength={11} placeholder={verrou ? "Rempli par l'annuaire" : '9 chiffres'} className={sirenFaux ? 'error' : ''}
                                onChange={e => { const v = e.target.value; setModal(m => ({...m, siren: v, tvaIntra: estFrance(m) && sirenValide(chiffres(v)) && (!m.tvaIntra || m.tvaIntra === tvaDepuisSiren(chiffres(m.siren))) ? tvaDepuisSiren(chiffres(v)) : m.tvaIntra})); }} />
                              {sirenFaux && <span className="error-msg">SIREN invalide</span>}
                            </div>}
                            <div className={`form-group ${estFrance(modal) ? '' : 'full'}`}><label>N° TVA intracommunautaire</label>
                              <input value={modal.tvaIntra || ''} readOnly={verrou} placeholder={estFrance(modal) ? 'Calculé depuis le SIREN' : "Clients de l'Union européenne seulement, ex. DE123456789"} onChange={e => setModal({...modal, tvaIntra: e.target.value})} />
                              {!estFrance(modal) && (paysUE(modal.pays) || modal.tvaIntra) && (
                                <VerifVies client={modal} demandeur={data.entreprise.tvaIntra}
                                  onResultat={(vies) => setModal(m => ({...m, tvaIntra: vies.numero, vies}))}
                                  onReprendre={(v) => setModal(m => { const a = adresseDepuisVies(v.adresse) || {};
                                    const ancien = m.enseigne || m.nom || '';
                                    return {...m, nom: v.nom, enseigne: ancien && normNom(ancien) !== normNom(v.nom) ? ancien : (m.enseigne || ''),
                                      adresse: a.adresse ?? m.adresse, codePostal: a.codePostal ?? m.codePostal, ville: a.ville ?? m.ville, _cle: (m._cle || 0) + 1}; })} />
                              )}</div>
                          </>)}
                          <AdresseBloc key={`fact-${modal.numero}-${modal._cle || 0}`} titre={part ? 'Adresse' : 'Adresse du siège'} valeur={modal}
                            onChange={(v) => setModal(m => ({...m, adresse: v.adresse, codePostal: v.codePostal, ville: v.ville, pays: v.pays}))} />
                          {verrou && !modal.annuaire && modal.nom && <div className="form-group full"><div className="alerte-info" style={{marginTop: 0}}>Fiche à compléter : cherchez « {nomAffiche(modal)} » dans l'annuaire ci-dessus.</div></div>}
                          {pro && modal.saisieManuelle && <div className="form-group full"><span className="manual-toggle" style={{marginTop: 0}} onClick={() => setModal(m => ({...m, saisieManuelle: false}))}>🔍 Revenir à l'annuaire</span></div>}
                        </div>
                      </div>
                    </>);
                  })()}
                  <div className="form-group full">
                    <label className="case-livraison"><input type="checkbox" checked={!!modal.livraison}
                      onChange={e => setModal(m => ({...m, livraison: e.target.checked ? { nom: '', adresse: '', codePostal: '', ville: '', pays: m.pays || 'France' } : null}))} />
                      Livrer à une autre adresse</label>
                    {!modal.livraison && etabs.length > 0 && (
                      <div className="alerte-info" style={{marginTop: 6}}>
                        Cette entreprise a aussi {etabs.length > 1 ? 'des établissements' : 'un établissement'} :
                        {etabs.slice(0, 3).map((x, i) => (
                          <div key={i} style={{marginTop: 4}}>{x.enseigne && <strong>{x.enseigne} — </strong>}{x.adresse}, {x.codePostal} {x.ville}{' '}
                            <span className="manual-toggle" onClick={() => setModal(m => ({...m, livraison: { nom: x.enseigne || '', adresse: x.adresse, codePostal: x.codePostal, ville: x.ville, pays: 'France' }, _cleL: (m._cleL || 0) + 1 }))}>→ livrer ici</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                  {modal.livraison && (
                    <div className="cartouche cartouche-livraison">
                      <div className="cartouche-titre">Adresse de livraison</div>
                      <div className="form-grid">
                        <div className="form-group full"><label>Nom du lieu de livraison</label><input value={modal.livraison.nom || ''} placeholder="Facultatif : le restaurant, l'entrepôt…" onChange={e => setModal(m => ({...m, livraison: {...m.livraison, nom: e.target.value}}))} /></div>
                        <AdresseBloc key={`livr-${modal.numero}-${modal._cleL || 0}`} titre="Adresse" valeur={modal.livraison}
                          onChange={(v) => setModal(m => ({...m, livraison: {...m.livraison, ...v}}))} />
                      </div>
                    </div>
                  )}
                  <div className="form-group"><label>Téléphone</label><input value={modal.telephone} onChange={e => setModal({...modal, telephone: e.target.value})} /></div>
                  <div className="form-group"><label>Email</label><input type="email" value={modal.email} onChange={e => setModal({...modal, email: e.target.value})} /></div>
                  <div className="form-group full"><label>Remarques</label><textarea value={modal.remarques} onChange={e => setModal({...modal, remarques: e.target.value})} rows={2} /></div>
                </div>
                <div className="btn-group"><button className="btn btn-primary" onClick={save}>Enregistrer</button><button className="btn btn-outline" onClick={() => setModal(null)}>Annuler</button></div>
              </div>
            </div>
          )}
          {confirmDelete !== null && <ConfirmModal title="Supprimer ?" message="Le client sera déplacé vers la corbeille." onConfirm={deleteClient} onCancel={() => setConfirmDelete(null)} />}
          {verifTous && (
            <div className="modal-overlay" onClick={() => !verifTous.enCours && setVerifTous(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <div className="modal-header"><div className="modal-title">N° de TVA des clients de l'Union européenne</div>{!verifTous.enCours && <button className="close-btn" onClick={() => setVerifTous(null)}>×</button>}</div>
                <p style={{fontSize: 13, marginBottom: 10}}>{verifTous.enCours ? `Vérification dans VIES… ${verifTous.resultats.length} / ${verifTous.total}` : `Terminé : ${verifTous.resultats.filter(r => r.statut === 'valide').length} valide(s) sur ${verifTous.total}. Les résultats sont enregistrés dans les fiches.`}</p>
                <table className="verif-liste"><tbody>
                  {[...verifTous.resultats].sort((a, b) => (a.statut === 'valide') - (b.statut === 'valide')).map(r => (
                    <tr key={r.c.numero}><td className="ref-code">{r.c.numero}</td><td>{nomAffiche(r.c)}</td><td>{r.c.pays}</td>
                      <td>{r.statut === 'valide' ? <span className="tva-ok">✓ valide</span> : r.statut === 'invalide' ? <span className="tva-ko">✗ inconnu de VIES</span> : r.statut === 'manquant' ? <span className="siren-manquant">n° à demander</span> : <span className="tva-ko" title={r.texte}>non vérifié : {r.texte}</span>}</td></tr>
                  ))}
                </tbody></table>
                {!verifTous.enCours && <div className="btn-group"><button className="btn btn-primary" onClick={() => setVerifTous(null)}>Fermer</button></div>}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Paramètres : entreprises gérées (données, numérotation et connexion Super PDP séparées)
    function CarteEntreprises() {
      const ctx = React.useContext(EntrepriseCtx);
      const [form, setForm] = useState(null);
      const [erreur, setErreur] = useState('');
      const [edition, setEdition] = useState(null);
      if (!RELAIS) return null;
      const renommer = async () => { if (!edition.nom.trim()) return; try { await ctx.renommer(edition.id, edition.nom.trim()); setEdition(null); } catch (e) { setErreur(e.message); } };
      const valider = async () => {
        if (!form.nom.trim()) { setErreur('Nom obligatoire'); return; }
        const pref = form.prefixe.trim().toUpperCase();
        if (!/^[A-Z]{1,4}-?$/.test(pref) || pref === 'F') { setErreur('Préfixe : 1 à 4 lettres, différent de « F » (déjà utilisé par l\'entreprise principale)'); return; }
        try { await ctx.ajouter({ nom: form.nom.trim(), mode: form.mode, prefixe: pref }); } catch (e) { setErreur(e.message); }
      };
      return (
        <div className="card">
          <div className="card-title">Entreprises</div>
          <p style={{fontSize: 13, marginBottom: 10}}>Chaque entreprise a ses propres factures, numérotation, sauvegardes et connexion Super PDP ; les clients sont communs. On passe de l'une à l'autre par le menu en haut à gauche.</p>
          {(() => { const s = ctx.liste.map(e => e.siren).filter(Boolean); return s.length !== new Set(s).size
            ? <div className="vies vies-ko" style={{marginBottom: 10}}>Deux entreprises ont le même SIREN : vérifiez le SIRET de chacune dans ses Paramètres. Sinon, les factures de l'une pourraient partir au nom de l'autre.</div> : null; })()}
          <table className="liste-entreprises"><tbody>
            {ctx.liste.map((e, i) => (
              <tr key={e.id}><td style={{width: 14}}><span style={{display: 'inline-block', width: 10, height: 10, borderRadius: 5, background: COULEURS_ENTREPRISE[i % COULEURS_ENTREPRISE.length]}} /></td>
                <td>{edition && edition.id === e.id
                  ? <span style={{display: 'flex', gap: 8}}><input autoFocus value={edition.nom} onChange={ev => setEdition({...edition, nom: ev.target.value})} onKeyDown={ev => { if (ev.key === 'Enter') renommer(); if (ev.key === 'Escape') setEdition(null); }} /><button className="btn btn-primary" onClick={renommer}>OK</button></span>
                  : <><strong>{e.nom || (e.id === 'principale' ? 'Entreprise principale' : e.id)}</strong>{e.id === 'principale' && <span style={{color: 'var(--text-muted)'}}> — principale</span>}{' '}
                    <span className="manual-toggle" style={{marginLeft: 8}} onClick={() => setEdition({ id: e.id, nom: e.nom || '' })}>Renommer</span></>}</td>
                <td style={{textAlign: 'right'}}>{e.id === ctx.active ? <span style={{color: 'var(--text-muted)'}}>ouverte</span> : <button className="btn btn-outline" onClick={() => changerEntreprise(e.id)}>Ouvrir</button>}</td></tr>
            ))}
          </tbody></table>
          {!form ? <div className="btn-group"><button className="btn btn-outline" onClick={() => { setErreur(''); setForm({ nom: '', mode: 'simple', prefixe: 'E' }); }}>{Icons.plus} Ajouter une entreprise</button></div> : (
            <div className="cartouche cartouche-legale" style={{marginTop: 12}}>
              <div className="cartouche-titre">Nouvelle entreprise</div>
              <div className="form-grid">
                <div className="form-group full"><label>Nom (raison sociale)</label><input value={form.nom} placeholder="ex. Simon Rouillard EI" onChange={e => setForm({...form, nom: e.target.value})} /></div>
                <div className="form-group"><label>Type de facturation</label>
                  <select value={form.mode} onChange={e => setForm({...form, mode: e.target.value})}>
                    <option value="simple">Simple : lignes libres (intitulé et prix)</option>
                    <option value="complet">Complet : produits, transport, douanes</option>
                  </select></div>
                <div className="form-group"><label>Préfixe des n° de facture</label><input value={form.prefixe} maxLength={5} onChange={e => setForm({...form, prefixe: e.target.value})} />
                  <div style={{fontSize: 11, color: 'var(--text-muted)', marginTop: 4}}>Première facture : {(form.prefixe.trim().toUpperCase() || '?')}00001</div></div>
              </div>
              {erreur && <div className="vies vies-ko">{erreur}</div>}
              <div className="btn-group"><button className="btn btn-primary" onClick={valider}>Créer et ouvrir</button><button className="btn btn-outline" onClick={() => setForm(null)}>Annuler</button></div>
            </div>
          )}
        </div>
      );
    }

    // Page Paramètres
    function PageParametres({ data, updateData, showToast }) {
      const [entreprise, setEntreprise] = useState(data.entreprise);
      const ctxEnt = React.useContext(EntrepriseCtx);
      const sauvegardeComplete = async () => {
        try {
          const blob = await appelRelais('/api/sauvegarde-complete');
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `facturier_sauvegarde_complete_${new Date().toISOString().split('T')[0]}.zip`; a.click();
          showToast('Sauvegarde complète exportée');
        } catch (err) { showToast(err.message); }
      };
      const save = () => { updateData({ entreprise }); showToast('Paramètres enregistrés'); };

      const exportJSON = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `facturier_backup_${ENTREPRISE === 'principale' ? '' : ENTREPRISE + '_'}${new Date().toISOString().split('T')[0]}.json`; a.click();
        showToast('Sauvegarde exportée');
      };

      const exportExcel = () => {
        const wb = XLSX.utils.book_new();
        const prodHeaders = ['Référence', 'Cuvée', 'Millésime', 'Contenance', 'Prix pro HT', 'Prix export HT', 'Prix particulier', 'Particulier saisi', 'Épuisé'];
        const prodRows = data.produits.map(p => { const px = prixProduit(p); return [p.reference, p.cuvee, p.millesime, p.contenance, px.pro ?? '', px.export ?? '', px.particulier ?? '', p.particulierTTC ? 'TTC' : 'HT', p.epuise ? 'oui' : '']; });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([prodHeaders, ...prodRows]), 'Produits');
        const clientHeaders = ['Numéro', 'Type', 'Raison sociale / Nom', 'Enseigne', 'SIREN', 'N° TVA', 'Vérifié VIES', 'Adresse', 'CP', 'Ville', 'Pays', 'Tél', 'Email'];
        const clientRows = data.clients.map(c => { const v = viesAJour(c); return [c.numero, c.type, c.nom, c.enseigne || '', c.siren || '', c.tvaIntra || '', v ? `${v.valide ? 'valide' : 'invalide'} le ${dateFr(v.date)}${v.consultation ? ' (' + v.consultation + ')' : ''}` : '', c.adresse, c.codePostal, c.ville, c.pays, c.telephone || c.portable, c.email]; });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([clientHeaders, ...clientRows]), 'Clients');
        const factHeaders = ['Numéro', 'Date', 'Client', 'Total HT', 'TVA', 'Total TTC', 'Statut', 'Échéance', 'Date paiement'];
        const factRows = data.factures.map(f => [f.numero, f.date, f.client?.nom, f.totalHT, f.totalTVA, f.totalTTC, f.statut, f.echeance, f.datePaiement]);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([factHeaders, ...factRows]), 'Factures');
        XLSX.writeFile(wb, `facturier_export_${ENTREPRISE === 'principale' ? '' : ENTREPRISE + '_'}${new Date().toISOString().split('T')[0]}.xlsx`);
        showToast('Export Excel généré');
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => importerSauvegarde(event.target.result, data, updateData, showToast);
          reader.readAsText(file);
        }
        e.target.value = '';
      };

      return (
        <div>
          <h1 className="page-title">Paramètres</h1>
          <div className="card">
            <div className="card-title">Informations entreprise</div>
            <div className="form-grid">
              <div className="form-group"><label>Raison sociale</label><input value={entreprise.raisonSociale} onChange={e => setEntreprise({...entreprise, raisonSociale: e.target.value})} /></div>
              <div className="form-group"><label>Forme juridique</label><input value={entreprise.forme} onChange={e => setEntreprise({...entreprise, forme: e.target.value})} /></div>
              <div className="form-group full"><label>Adresse</label><input value={entreprise.adresse} onChange={e => setEntreprise({...entreprise, adresse: e.target.value})} /></div>
              <div className="form-group"><label>Code postal</label><input value={entreprise.codePostal} onChange={e => setEntreprise({...entreprise, codePostal: e.target.value})} /></div>
              <div className="form-group"><label>Ville</label><input value={entreprise.ville} onChange={e => setEntreprise({...entreprise, ville: e.target.value})} /></div>
              <div className="form-group"><label>Téléphone</label><input value={entreprise.telephone} onChange={e => setEntreprise({...entreprise, telephone: e.target.value})} /></div>
              <div className="form-group"><label>Email</label><input type="email" value={entreprise.email} onChange={e => setEntreprise({...entreprise, email: e.target.value})} /></div>
              {ENTREPRISE !== 'principale' && (<>
                <div className="form-group"><label>Type de facturation</label>
                  <select value={entreprise.mode === 'simple' ? 'simple' : 'complet'} onChange={e => setEntreprise({...entreprise, mode: e.target.value})}>
                    <option value="simple">Simple : lignes libres (intitulé et prix)</option>
                    <option value="complet">Complet : produits, transport, douanes</option>
                  </select></div>
                <div className="form-group"><label>Préfixe des n° de facture</label>
                  <input value={entreprise.prefixeFacture || 'F'} readOnly={data.factures.length + (data.facturesSupprimes || []).length > 0} maxLength={5}
                    onChange={e => setEntreprise({...entreprise, prefixeFacture: e.target.value.toUpperCase()})} />
                  {data.factures.length + (data.facturesSupprimes || []).length > 0 && <div style={{fontSize: 11, color: 'var(--text-muted)', marginTop: 4}}>Figé : des factures ont déjà été numérotées.</div>}</div>
              </>)}
            </div>
          </div>
          <div className="card">
            <div className="card-title">Informations légales</div>
            <div className="form-grid">
              <div className="form-group"><label>N° SIRET</label><input value={entreprise.siret} onChange={e => setEntreprise({...entreprise, siret: e.target.value})} /></div>
              <div className="form-group"><label>N° TVA Intra.</label><input value={entreprise.tvaIntra} onChange={e => setEntreprise({...entreprise, tvaIntra: e.target.value})} /></div>
              <div className="form-group"><label>N° EORI</label><input value={entreprise.eori} onChange={e => setEntreprise({...entreprise, eori: e.target.value})} /></div>
              <div className="form-group"><label>N° EA</label><input value={entreprise.ea} onChange={e => setEntreprise({...entreprise, ea: e.target.value})} /></div>
              <div className="form-group"><label>N° Accise</label><input value={entreprise.numeroAccise} onChange={e => setEntreprise({...entreprise, numeroAccise: e.target.value})} /></div>
            </div>
          </div>
          <div className="card">
            <div className="card-title">Coordonnées bancaires</div>
            <div className="form-grid">
              <div className="form-group"><label>Banque</label><input value={entreprise.banque} onChange={e => setEntreprise({...entreprise, banque: e.target.value})} /></div>
              <div className="form-group full"><label>RIB / IBAN (texte imprimé sur la facture)</label><input value={entreprise.rib} onChange={e => setEntreprise({...entreprise, rib: e.target.value})} /></div>
              <div className="form-group full"><label>IBAN (pour la facture électronique)</label><input value={entreprise.iban || ''} placeholder="FR76 ..." onChange={e => setEntreprise({...entreprise, iban: e.target.value})} /></div>
              <div className="form-group"><label>BIC</label><input value={entreprise.bic || ''} onChange={e => setEntreprise({...entreprise, bic: e.target.value})} /></div>
            </div>
          </div>
          <div className="card">
            <div className="card-title">Mentions légales (factures aux professionnels)</div>
            <div className="form-grid">
              {[['penalites', 'Pénalités de retard'], ['indemnite', 'Indemnité forfaitaire de recouvrement'], ['escompte', 'Escompte pour paiement anticipé']].map(([k, label]) => (
                <div className="form-group full" key={k}><label>{label}</label>
                  <textarea rows={2} value={mentionsEntreprise(entreprise)[k]} onChange={e => setEntreprise({...entreprise, mentions: {...mentionsEntreprise(entreprise), [k]: e.target.value}})} />
                </div>
              ))}
            </div>
          </div>
          <div className="btn-group"><button className="btn btn-primary" onClick={save}>Enregistrer</button></div>
          <CarteSuperPDP />
          <CarteEntreprises />
          <CarteMisesAJour />
          <div className="card">
            <div className="card-title">Sauvegarde & Export</div>
            <div className="btn-group" style={{marginTop: 0}}>
              {RELAIS && ctxEnt.liste.length > 1 && <button className="btn btn-primary" onClick={sauvegardeComplete}>{Icons.download} Sauvegarde complète (toutes les entreprises)</button>}
              <button className={`btn ${RELAIS && ctxEnt.liste.length > 1 ? 'btn-outline' : 'btn-primary'}`} onClick={exportExcel}>{Icons.download} Excel{ctxEnt.liste.length > 1 ? ' (cette entreprise)' : ''}</button>
              <button className="btn btn-outline" onClick={exportJSON}>{Icons.download} JSON{ctxEnt.liste.length > 1 ? ' (cette entreprise)' : ''}</button>
              <label className="btn btn-outline" style={{cursor: 'pointer'}}>
                {Icons.upload} Importer
                <input type="file" accept=".json" onChange={importData} style={{display: 'none'}} />
              </label>
            </div>
            <p style={{fontSize: 12, color: 'var(--text-muted)', marginTop: 8}}>Importer remplace toutes les données de l'entreprise ouverte ({data.entreprise.raisonSociale || 'sans nom'}).</p>
          </div>
        </div>
      );
    }

    // Page Douanes (déclaration mensuelle aux douanes)
    function PageDouanes({ data, updateData, setPage, showToast }) {
      const today = new Date();
      const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      const [year, setYear] = useState(lastMonth.getFullYear());
      const [month, setMonth] = useState(lastMonth.getMonth() + 1);
      const [includeEmise, setIncludeEmise] = useState(false);
      const [expandedCell, setExpandedCell] = useState(null);
      const [categorieModal, setCategorieModal] = useState(false);

      // Cuvées utilisées dans les produits actifs
      const cuveesUsed = useMemo(() => {
        return [...new Set(data.produits.map(p => p.cuvee))].sort();
      }, [data.produits]);

      const categorieMap = data.categorieDouanes || {};
      const unmappedCuvees = cuveesUsed.filter(c => !categorieMap[c]);

      // Calcul du tableau DRM
      const drmData = useMemo(() => {
        const startDate = new Date(year, month - 1, 1);
        const endDate = new Date(year, month, 0, 23, 59, 59, 999);
        const statusOk = includeEmise
          ? ['emise', 'envoyee', 'payee']
          : ['envoyee', 'payee'];

        const emptyCell = () => ({ hl: 0, factures: [] });
        const matrix = {
          VSIG_BLANC: { France: emptyCell(), UE: emptyCell(), Export: emptyCell() },
          VSIG_ROUGE: { France: emptyCell(), UE: emptyCell(), Export: emptyCell() },
          VSIG_ROSE: { France: emptyCell(), UE: emptyCell(), Export: emptyCell() },
          BULLE: { France: emptyCell(), UE: emptyCell(), Export: emptyCell() },
          SANS_ALCOOL: { France: emptyCell(), UE: emptyCell(), Export: emptyCell() },
          AUTRES: { France: emptyCell(), UE: emptyCell(), Export: emptyCell() }
        };

        (data.factures || []).forEach(f => {
          if (!statusOk.includes(f.statut)) return;
          if (!f.date) return;
          const fDate = new Date(f.date);
          if (fDate < startDate || fDate > endDate) return;

          // TVA française (20 / 10 / 5,5 %) = vente en France ; TVA 0 % = sortie vers l'UE ou export selon le pays du client
          const pays = String((f.client && f.client.pays) || '').trim();
          const destination = (parseFloat(f.tauxTVA) || 0) > 0 ? 'France' : !pays ? 'Export' : estFrance(f.client) ? 'France' : paysUE(pays) ? 'UE' : 'Export';

          (f.lignes || []).forEach(l => {
            if (!l.produitRef) return;
            const produit = findProduitAnyState(data, l.produitRef);
            if (!produit) return;

            const rawCat = categorieMap[produit.cuvee];
            const cat = ['VSIG_BLANC', 'VSIG_ROUGE', 'VSIG_ROSE', 'BULLE', 'SANS_ALCOOL'].includes(rawCat) ? rawCat : 'AUTRES';
            const hl = toHectolitres(l.quantite || 0, produit.contenance);

            matrix[cat][destination].hl += hl;
            matrix[cat][destination].factures.push({
              numero: f.numero,
              date: f.date,
              client: f.client && f.client.nom,
              pays: (f.client && f.client.pays) || '',
              statut: f.statut,
              cuvee: produit.cuvee,
              millesime: produit.millesime,
              contenance: produit.contenance,
              quantite: l.quantite,
              hl: hl
            });
          });
        });

        return matrix;
      }, [data.factures, data.produits, data.produitsSupprimes, categorieMap, year, month, includeEmise]);

      const formatHl = (hl) => hl.toFixed(3);

      const COLS_DRM = [['France', 'France'], ['UE', 'Union européenne'], ['Export', 'Export hors UE']];
      const totalCol = (col) => ['VSIG_BLANC','VSIG_ROUGE','VSIG_ROSE','BULLE','SANS_ALCOOL','AUTRES'].reduce((s, k) => s + drmData[k][col].hl, 0);
      const grandTotal = COLS_DRM.reduce((s, [col]) => s + totalCol(col), 0);

      const yearsAvailable = useMemo(() => {
        const years = new Set([today.getFullYear(), lastMonth.getFullYear()]);
        (data.factures || []).forEach(f => {
          if (f.date) years.add(new Date(f.date).getFullYear());
        });
        return [...years].sort((a, b) => b - a);
      }, [data.factures]);

      return (
        <div>
          <div className="page-header">
            <h1 className="page-title">Douanes</h1>
            <button className="btn btn-outline" onClick={() => setCategorieModal(true)}>
              Catégories douanes
            </button>
          </div>

          {unmappedCuvees.length > 0 && (
            <div className="card" style={{borderLeft: '4px solid var(--warning)', background: 'var(--warning-light)'}}>
              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 16, flexWrap: 'wrap'}}>
                <div>
                  <div style={{fontWeight: 600, marginBottom: 4}}>
                    {unmappedCuvees.length} cuvée{unmappedCuvees.length > 1 ? 's' : ''} sans catégorie douanes
                  </div>
                  <div style={{fontSize: 13, color: 'var(--text-muted)'}}>
                    Sans catégorie, les volumes tombent dans la ligne « Autres » (qui doit normalement rester à 0).
                  </div>
                  <div style={{fontSize: 12, color: 'var(--text-muted)', marginTop: 6, fontFamily: 'JetBrains Mono, monospace'}}>
                    {unmappedCuvees.join(' · ')}
                  </div>
                </div>
                <button className="btn btn-primary" onClick={() => setCategorieModal(true)}>
                  Compléter
                </button>
              </div>
            </div>
          )}

          <div className="card">
            <div className="card-title">Déclaration Récapitulative aux Douanes (DRM)</div>
            <div className="filters-row">
              <div className="filter-group">
                <label>Mois</label>
                <select value={month} onChange={ev => setMonth(parseInt(ev.target.value))}>
                  {MOIS_NOMS.map((m, i) => <option key={i} value={i + 1}>{m}</option>)}
                </select>
              </div>
              <div className="filter-group">
                <label>Année</label>
                <select value={year} onChange={ev => setYear(parseInt(ev.target.value))}>
                  {yearsAvailable.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
              <div className="filter-group" style={{justifyContent: 'flex-end'}}>
                <label style={{display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer', textTransform: 'none', letterSpacing: 0, fontSize: 13}}>
                  <input type="checkbox" checked={includeEmise} onChange={ev => setIncludeEmise(ev.target.checked)} style={{width: 'auto', minWidth: 0}} />
                  Inclure les factures émises (non envoyées)
                </label>
              </div>
            </div>

            <table className="drm-table">
              <thead>
                <tr>
                  <th>Catégorie</th>
                  {COLS_DRM.map(([col, lib]) => <th key={col} style={{textAlign: 'right'}}>{lib} (hL)</th>)}
                  <th style={{textAlign: 'right'}}>Total (hL)</th>
                </tr>
              </thead>
              <tbody>
                {['VSIG_BLANC', 'VSIG_ROUGE', 'VSIG_ROSE', 'BULLE', 'SANS_ALCOOL', 'AUTRES'].map(key => {
                  const row = drmData[key];
                  const rowTotal = COLS_DRM.reduce((s, [col]) => s + row[col].hl, 0);
                  const isAutres = key === 'AUTRES';
                  const hasAlert = isAutres && rowTotal > 0;
                  const label = CATEGORIE_LABELS[key];
                  return (
                    <React.Fragment key={key}>
                      <tr className={hasAlert ? 'drm-row-alert' : ''}>
                        <td>
                          <strong>{label}</strong>
                          {isAutres && <span style={{marginLeft: 8, fontSize: 11, color: 'var(--text-muted)', fontStyle: 'italic'}}>(contrôle — doit être à 0)</span>}
                        </td>
                        {COLS_DRM.map(([col]) => (
                        <td key={col} style={{textAlign: 'right'}}>
                          {row[col].factures.length > 0 ? (
                            <button className="drm-cell-btn" onClick={() => setExpandedCell(expandedCell === `${key}_${col}` ? null : `${key}_${col}`)}>
                              {formatHl(row[col].hl)}
                              <span style={{marginLeft: 4, fontSize: 10, opacity: 0.6}}>{expandedCell === `${key}_${col}` ? '▴' : '▾'}</span>
                            </button>
                          ) : (
                            <span>{formatHl(row[col].hl)}</span>
                          )}
                        </td>))}
                        <td style={{textAlign: 'right', fontWeight: 600}}>{formatHl(rowTotal)}</td>
                      </tr>
                      {COLS_DRM.map(([col]) => expandedCell === `${key}_${col}` && row[col].factures.length > 0 && (
                        <DrmDetailRow key={col} factures={row[col].factures} />
                      ))}
                    </React.Fragment>
                  );
                })}
              </tbody>
              <tfoot>
                <tr className="drm-total-row">
                  <td><strong>Total</strong></td>
                  {COLS_DRM.map(([col]) => <td key={col} style={{textAlign: 'right'}}><strong>{formatHl(totalCol(col))}</strong></td>)}
                  <td style={{textAlign: 'right'}}><strong>{formatHl(grandTotal)}</strong></td>
                </tr>
              </tfoot>
            </table>

            <div style={{marginTop: 16, fontSize: 12, color: 'var(--text-muted)'}}>
              Volumes calculés à partir des factures {includeEmise ? 'émises, envoyées et payées' : 'envoyées et payées'} du mois. France = TVA française (ou client en France), UE et Export hors UE = TVA 0 % selon le pays du client.
            </div>
          </div>

          {categorieModal && (
            <CategorieDouanesModal
              data={data}
              updateData={updateData}
              onClose={() => setCategorieModal(false)}
              showToast={showToast}
              cuveesUsed={cuveesUsed}
            />
          )}
        </div>
      );
    }

    function DrmDetailRow({ factures }) {
      return (
        <tr className="drm-detail-row">
          <td colSpan="4" style={{padding: 0, background: 'var(--bg)'}}>
            <div style={{padding: '8px 12px'}}>
              <table className="drm-detail-table">
                <thead>
                  <tr>
                    <th>Facture</th>
                    <th>Date</th>
                    <th>Client</th>
                    <th>Pays</th>
                    <th>Cuvée / Mill.</th>
                    <th>Contenance</th>
                    <th style={{textAlign: 'right'}}>Qté (bout.)</th>
                    <th style={{textAlign: 'right'}}>Volume (hL)</th>
                  </tr>
                </thead>
                <tbody>
                  {factures.map((f, i) => (
                    <tr key={i}>
                      <td className="ref-code">{f.numero}</td>
                      <td>{formatDate(f.date)}</td>
                      <td>{f.client || '-'}</td>
                      <td>{f.pays || '-'}</td>
                      <td>{f.cuvee} {f.millesime && `· ${f.millesime}`}</td>
                      <td>{f.contenance}</td>
                      <td style={{textAlign: 'right'}}>{f.quantite}</td>
                      <td style={{textAlign: 'right'}}>{f.hl.toFixed(4)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </td>
        </tr>
      );
    }

    function CategorieDouanesModal({ data, updateData, onClose, showToast, cuveesUsed }) {
      const [mapping, setMapping] = useState(() => {
        const init = {};
        cuveesUsed.forEach(c => {
          init[c] = (data.categorieDouanes || {})[c] || '';
        });
        return init;
      });

      const save = () => {
        const cleaned = {};
        Object.keys(mapping).forEach(c => {
          if (mapping[c]) cleaned[c] = mapping[c];
        });
        updateData({ categorieDouanes: cleaned });
        showToast('Catégories douanes enregistrées');
        onClose();
      };

      const allFilled = cuveesUsed.every(c => mapping[c]);

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal large" onClick={ev => ev.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">Catégories douanes par cuvée</div>
              <button className="close-btn" onClick={onClose}>×</button>
            </div>
            <p style={{color: 'var(--text-muted)', fontSize: 13, marginBottom: 16}}>
              Pour chaque cuvée, choisissez la catégorie utilisée dans la déclaration mensuelle aux douanes. Cette information s'applique à tous les produits de la cuvée.
            </p>
            <table>
              <thead>
                <tr>
                  <th>Cuvée</th>
                  <th style={{width: 220}}>Catégorie</th>
                </tr>
              </thead>
              <tbody>
                {cuveesUsed.map(c => (
                  <tr key={c}>
                    <td>{c}</td>
                    <td>
                      <select
                        value={mapping[c]}
                        onChange={ev => setMapping({...mapping, [c]: ev.target.value})}
                        style={{width: '100%'}}
                        className={!mapping[c] ? 'select-empty' : ''}
                      >
                        <option value="">— Aucune (Autres) —</option>
                        {CATEGORIES_DOUANES.map(cat => (
                          <option key={cat.key} value={cat.key}>{cat.label}</option>
                        ))}
                      </select>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            {!allFilled && (
              <div style={{fontSize: 12, color: 'var(--warning)', marginTop: 12}}>
                Les cuvées sans catégorie tomberont dans la ligne « Autres » du tableau.
              </div>
            )}
            <div className="btn-group">
              <button className="btn btn-primary" onClick={save}>Enregistrer</button>
              <button className="btn btn-outline" onClick={onClose}>Annuler</button>
            </div>
          </div>
        </div>
      );
    }


    // Erreur d'affichage (données inattendues) : message lisible au lieu d'une page blanche ; rien n'est enregistré
    class Secours extends React.Component {
      constructor(p) { super(p); this.state = { erreur: null }; }
      static getDerivedStateFromError(erreur) { ECRITURE.bloque = true; return { erreur }; }
      render() {
        if (!this.state.erreur) return this.props.children;
        return <div className="card" style={{margin: 24}}><div className="card-title">Le Facturier n'a pas pu afficher vos données</div>
          <p style={{fontSize: 13}}>Rien n'a été enregistré depuis ce problème. Fermez la fenêtre et rouvrez le Facturier ; si le message revient, une sauvegarde du jour précédent se trouve dans « donnees/sauvegardes », et prévenez Antoine.</p>
          <p style={{fontSize: 12, color: 'var(--text-muted)', marginTop: 8}}>Détail : {String(this.state.erreur && this.state.erreur.message || this.state.erreur)}</p></div>;
      }
    }
    ReactDOM.render(<Secours><App /></Secours>, document.getElementById('root'));
  </script>
</body>
</html>
